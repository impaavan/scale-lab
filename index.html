  }
  function act(k,v){
    if(k==='bound')S.bound=v==='on';else if(k==='idem')S.idem=v==='on';
    else if(k==='burst')T.burst=10;else if(k==='pause')T.paused=!T.paused;else if(k==='reset')resetSim();
  }
  function initState(){S.arr=250;S.workers=3;S.per=100;S.bound=false;S.crash=0;S.idem=false;}

  SL.add({id:8,short:'Queues and async work',title:'Queues and async work',
    tag:'Not everything has to finish before the user gets an answer. A queue smooths bursts, but it has its own ways to fail.',
    sim:{html:HTML,init:function(el){initState();init(el);},update:update,apply:apply,act:act,destroy:destroy},
    steps:[
      {t:'Do not make the user wait',
       b:function(){return '<p>Some work is slow or unreliable: sending an email, resizing a photo, calling a payment provider, building a report. If the request waits for it, the user waits too, and a slow dependency makes your whole site slow.</p><p>The pattern: accept the request, put a job on a queue, reply "accepted" in milliseconds, and let workers do the job in the background. Look at the gauge "User waits for the request".</p><p>Good candidates: anything the user does not need the result of right now. Bad candidates: checking a password, reading a profile.</p>';},
       tries:[{l:'Reset',reset:true,arr:250,workers:3,per:100,bound:false,crash:0,idem:false}]},
      {t:'A queue absorbs bursts',
       b:function(){return '<p>Traffic comes in waves. Without a queue you must size workers for the peak. With a queue you size them for the average and let the queue hold the spike.</p><p>Press the burst button. For 10 seconds jobs arrive at five times the normal rate (1,250/s against 300/s of capacity). The queue fills, then drains once the burst ends. The drain time is backlog ÷ (capacity - arrival rate).</p>';},
       tries:[{l:'Burst now',burst:true},{l:'Add 2 workers',workers:5},{l:'Reset',reset:true,workers:3}]},
      {t:'When work arrives faster than it leaves',
       b:function(){return '<p>A queue helps with bursts. It cannot help if the average arrival rate is above capacity. Set arrivals to 400/s with workers that do 300/s. The queue grows without limit, wait times grow with it, and eventually memory runs out.</p><p>Three honest options: add workers, make jobs cheaper, or refuse some work. Setting a queue limit does the third. New jobs are rejected, and callers see an error or slow down. That is backpressure.</p>';},
       tries:[{l:'Overload: 400/s vs 300/s',reset:true,arr:400,workers:3,per:100,bound:false},{l:'Add a queue limit',bound:true},{l:'Add 2 workers',workers:5,bound:false}]},
      {t:'At-least-once delivery',
       b:function(){return '<p>Queues usually promise at-least-once delivery. A worker takes a job, does the work, and confirms. If it crashes before confirming, the queue gives the job to another worker. The work may have already happened.</p><p>So every job must be safe to run twice. That property is idempotency. Attach a unique id to each job, record the ids you have handled, and skip repeats. Set 20% crashes with idempotency off, then on.</p>';},
       tries:[{l:'20% crash, not idempotent',reset:true,arr:250,workers:3,crash:20,idem:false,bound:false},{l:'Turn idempotency on',idem:true}]},
      {t:'What you can take away',
       b:function(){return '<ul><li>Move slow, unreliable or non-urgent work behind a queue and answer fast.</li><li>A queue handles bursts. It does not fix sustained overload.</li><li>Bound your queues so they push back instead of eating all memory.</li><li>Delivery is at least once, so make jobs idempotent.</li><li>Watch queue depth and age. They are the early warning for everything downstream.</li></ul><p>Next level: with many machines, copies of data can disagree. Learn what consistency costs and why partitions force a choice.</p>';}}
    ],
    quiz:[
      {q:'Which task is best moved onto a queue?',o:['Checking a password at login','Resizing an uploaded photo','Reading a user\'s profile for the page','Verifying a session token'],a:1,h:'Which one can finish after the user has their answer?',x:'Photo processing can happen in the background. Login and profile reads must finish before the page can respond.'},
      {q:'Jobs arrive at 400/s, workers finish 300/s, and the queue has no limit. What happens over time?',o:['The queue settles at a stable size','The queue grows without bound and waits keep getting longer','Jobs are processed twice as fast','Nothing, queues absorb any load'],a:1,h:'Compare the two rates over a long time.',x:'A queue only absorbs bursts. If average arrivals exceed capacity, the backlog grows forever.'},
      {q:'A worker finishes a payment, then crashes before confirming. The queue redelivers the job. What protects the customer?',o:['A bigger queue','Idempotency: a unique job id that makes the second run a no-op','More workers','Faster disks'],a:1,h:'The job will be delivered again.',x:'At-least-once delivery means duplicates happen. Idempotent jobs make them harmless.'},
      {q:'Why give a queue a size limit?',o:['It makes workers faster','It pushes back on callers instead of using all memory','It removes duplicates','It is required by the cloud'],a:1,h:'What if jobs keep arriving and nothing stops them?',x:'A limit turns unbounded growth into a clear signal. Callers can slow down or fail fast.'}
    ]});
})();
/* ===== Level 9: consistency and CAP ===== */
(function(){
  var H=SL.H,IDS=['A','B','C'],LAT={A:2,B:8,C:80},WHO={A:'Alice',B:'Bea',C:'Carlos'};
  var S={W:1,R:1,part:false};
  var N={},log=[],clock=0,accepted=[];
  var root=null;
  function q(s){return root.querySelector(s);}

  function reset(){IDS.forEach(function(i){N[i]={v:'free',ver:0};});log=[];clock=0;accepted=[];S.part=false;}
  function reach(x){return S.part?(x==='C'?['C']:['A','B']):IDS.slice();}
  function pick(x,r,k){var rest=r.filter(function(i){return i!==x;});return [x].concat(rest).slice(0,k);}
  function say(t){log.unshift(t);if(log.length>7)log.pop();}
  function best(ids){var m=ids[0];ids.forEach(function(i){if(N[i].ver>N[m].ver)m=i;});return N[m];}
  function sync(){
    var sides=S.part?[['A','B'],['C']]:[IDS];
    sides.forEach(function(side){var b=best(side),v=b.v,ver=b.ver;side.forEach(function(i){N[i]={v:v,ver:ver};});});
    var same=IDS.every(function(i){return N[i].ver===N.A.ver;});
    if(same){
      accepted.forEach(function(a){
        if(a.ts!==N.A.ver&&!a.lost){a.lost=true;say('Conflict: '+a.name+'\'s booking was accepted, then silently discarded. The latest write won ('+N.A.v+').');}
      });
    }
  }
  function book(x,name){
    var r=reach(x);
    if(r.length<S.R){say(name+' via '+x+': cannot check the seat. Only '+r.length+' of the '+S.R+' nodes needed for a read are reachable. Booking refused.');return;}
    var seen=best(pick(x,r,S.R));
    if(seen.v!=='free'){say(name+' via '+x+': seat already taken by '+seen.v+'. No write.');return;}

  function lat(k){var a=IDS.map(function(i){return LAT[i];}).sort(function(x,y){return x-y;});return a[k-1];}

  var HTML=

    H.slider('w9','Nodes that must confirm a write (W)',1,3,1)+H.slider('r9','Nodes that must answer a read (R)',1,3,1)+

  function init(el){

  }

    q('#w9').value=S.W;q('#r9').value=S.R;H.setText(root,'w9V',String(S.W));H.setText(root,'r9V',String(S.R));

  SL.add({id:9,short:'Consistency and CAP',title:'Consistency and CAP',

       tries:[{l:'Alice via A, Bea via B, catch up',reset:true,W:1,R:1,ops:[['book','A'],['book','B'],['catchup']]}]},

       tries:[{l:'Loose: split, both book, heal',reset:true,W:1,R:1,part:true,ops:[['book','A'],['book','C'],['heal']]},{l:'Majority: split, both try',reset:true,W:2,R:2,part:true,ops:[['book','A'],['book','C']]}]},

/* ===== Level 10: reliability under failure ===== */
(function(){
  var H=SL.H,CAP=100,SERV=0.1,TICK=0.5,HIST=120;
  var S={load:60,slow:false,timeout:2,retries:0,backoff:false,breaker:false,limit:false,shed:false};
  var T={queue:0,ok:0,fail:0,retr:0,hist:[],bst:'closed',bt:0};
  var root=null,timer=null;
  function q(s){return root.querySelector(s);}
  function svc(){return S.slow?SERV*2:SERV;}
  function resetT(){T.queue=0;T.ok=0;T.fail=0;T.retr=0;T.hist=[];T.bst='closed';T.bt=0;}

  /* fluid model: one dependency finishing CAP calls/s when healthy, half that when slow */
  var STATE={arr:0,util:0,okRate:0,failRate:0,sent:0,resp:0,rejected:0,breakerOpen:false};
  function step(){
    var base=S.load*0.01*CAP*1.0; /* req/s from users: load is % of capacity */
    var workers=CAP*SERV,cap=workers/svc();           /* calls per second the dependency can finish */
    var users=base;
    var retryF=S.retries;
    var tmo=S.timeout;
    /* previous failure fraction drives retries */
    var pf=STATE.failRate>0?STATE.failRate/Math.max(1,STATE.okRate+STATE.failRate):0;
    var extra=0;
    if(S.retries>0){var f=pf;extra=users*(f+f*f+f*f*f);if(S.retries<3)extra=users*(S.retries===1?f:f+f*f);if(S.backoff)extra*=0.25;}
    var shed=0;
    var send=users+extra;
    if(S.limit&&send>cap*0.9){shed=send-cap*0.9;send=cap*0.9;}
    if(S.breaker){
      if(T.bst==='open'){T.bt-=TICK;send=0;if(T.bt<=0)T.bst='half';}
      else if(T.bst==='half'){send=Math.min(send,cap*0.05+1);}
    }
    var admit=send,rho=admit/cap;
    var queue=T.queue+(admit-cap)*TICK;queue=H.clamp(queue,0,cap*30);T.queue=queue;
    var wait=queue/cap+svc(),done=Math.min(admit,cap);
    var timedOut=wait>tmo;
    var okShare=timedOut?0:1;
    if(S.shed&&timedOut){T.queue=Math.max(0,T.queue*0.5);}
    var ok=done*okShare,fail=(admit-ok)+shed+(S.breaker&&T.bst==='open'?users:0);
    /* user-facing */
    var userOk=Math.max(0,Math.min(users,ok*(users/Math.max(users+extra,0.0001))));
    if(S.breaker&&T.bst==='open'){userOk=S.shed?users*0.3:0;}
    if(S.breaker){
      var fr=admit>0?(admit-ok)/admit:0;
      if(T.bst==='closed'&&fr>0.5&&admit>5){T.bst='open';T.bt=8;}
      else if(T.bst==='half'){if(fr<0.2)T.bst='closed';else{T.bst='open';T.bt=8;}}
    }
    STATE={arr:users,util:rho,okRate:userOk,failRate:Math.max(0,users-userOk),sent:send,resp:wait,rejected:shed,extra:extra,breakerOpen:T.bst==='open',cap:cap};
    T.hist.push(Math.min(1,userOk/Math.max(users,0.0001)));if(T.hist.length>HIST)T.hist.shift();
  }
  function settle(n){for(var i=0;i<n;i++)step();}

  var HTML=
    '<div class="flow" id="fl10"></div>'+
    '<div class="readouts"><div><div class="k">Users OK</div><div class="v" id="ok10">0%</div></div><div><div class="k">Load on dependency</div><div class="v" id="ld10">0%</div></div><div><div class="k">Breaker</div><div class="v" id="br10">off</div></div></div>'+
    '<label class="ctl">Share of user requests that succeed, last 60 seconds</label><div id="ch10"></div>'+
    H.slider('l10','Traffic (% of dependency capacity)',10,120,60,5)+
    H.seg('slow','Dependency health',[{v:'ok',l:'Healthy'},{v:'slow',l:'Slow: half speed'}],'ok')+
    H.slider('t10','Timeout (seconds)',1,10,2)+
    H.seg('retries','Retries',[{v:'0',l:'None'},{v:'1',l:'1 retry'},{v:'3',l:'3 retries'}],'0')+
    H.seg('backoff','Retry spacing',[{v:'off',l:'Immediately'},{v:'on',l:'Backoff and jitter'}],'off')+
    H.seg('breaker','Circuit breaker',[{v:'off',l:'Off'},{v:'on',l:'On'}],'off')+
    H.seg('limit','Rate limit to dependency',[{v:'off',l:'Off'},{v:'on',l:'On'}],'off')+
    H.seg('shed','Degrade gracefully (serve cached fallback)',[{v:'off',l:'Off'},{v:'on',l:'On'}],'off')+
    '<div class="row"><button class="btn" data-act="lvl" data-k="reset">Reset</button></div>'+
    '<ul class="gauges" id="g10"></ul><p class="verdict" id="v10" aria-live="polite"></p>';

  function init(el){
    root=el;
    H.bind(el,{l10:function(v){S.load=Number(v);SL.refresh();},t10:function(v){S.timeout=Number(v);SL.refresh();}});
    resetT();settle(40);
    timer=setInterval(function(){step();update();},500);
  }
  function destroy(){if(timer){clearInterval(timer);timer=null;}}
  function update(){
    if(!root||!root.isConnected)return;
    var s=STATE,okP=s.arr>0?s.okRate/s.arr:1;
    q('#l10').value=S.load;q('#t10').value=S.timeout;H.setText(root,'l10V',S.load+'%');H.setText(root,'t10V',S.timeout+' s');
    H.syncSeg(root,'slow',S.slow?'slow':'ok');H.syncSeg(root,'retries',String(S.retries));H.syncSeg(root,'backoff',S.backoff?'on':'off');
    H.syncSeg(root,'breaker',S.breaker?'on':'off');H.syncSeg(root,'limit',S.limit?'on':'off');H.syncSeg(root,'shed',S.shed?'on':'off');
    H.setText(root,'ok10',H.pct(okP));H.setText(root,'ld10',s.util>9.99?'>999%':H.pct(s.util));H.setText(root,'br10',S.breaker?T.bst:'off');
    var dst=s.util<0.8?'ok':s.util<1?'warn':'bad';

      '<div class="nd st-'+(S.breaker&&T.bst==='open'?'bad':S.breaker?'ok':'info')+'"><b>Your service</b><span class="sub">sends '+H.fmtN(s.sent)+'/s'+(s.extra>0.5?' (incl. '+H.fmtN(s.extra)+' retries)':'')+'</span></div><span class="arr">→</span>'+
      '<div class="nd st-'+dst+'"><b>Dependency</b><div class="meter"><i style="width:'+Math.round(H.clamp(s.util,0,1)*100)+'%"></i></div><span class="sub">'+(S.slow?'slow · ':'')+(s.util>9.99?'>999%':H.pct(s.util))+' load · '+H.fmtMs(s.resp*1000)+'</span></div>';
    var pts=T.hist.map(function(v,i){return [i*0.5-(T.hist.length-1)*0.5,v*100];});
    q('#ch10').innerHTML=H.chart({w:320,h:150,xmin:-60,xmax:0,ymax:100,series:[{pts:pts}],xticks:[{x:-60,l:'-60 s'},{x:-30,l:'-30 s'},{x:0,l:'now'}],yticks:[{y:0,l:'0%'},{y:50,l:'50%'},{y:100,l:'100%'}],aria:'Share of user requests that succeed over the last 60 seconds'});
    var g='';
    g+=H.gauge('Dependency load',(s.util>9.99?'>999%':H.pct(s.util))+' of capacity',Math.min(1,s.util),dst,dst==='bad'?(s.extra>0.5?'Retries are adding '+H.fmtN(s.extra)+' extra calls a second to a service that is already struggling. This is a retry storm.':'Demand is above what the dependency can finish.'):'');
    g+=H.gauge('User success',H.pct(okP),okP,okP>0.99?'ok':okP>0.9?'warn':'bad',okP>0.99?'':'Users see errors or very slow pages.');
    g+=H.gauge('Wait vs. timeout',H.fmtMs(s.resp*1000)+' vs '+S.timeout+' s',Math.min(1,s.resp/S.timeout),s.resp<S.timeout*0.6?'ok':s.resp<S.timeout?'warn':'bad',s.resp>=S.timeout?'Calls take longer than the timeout, so they fail even though the dependency is still working on them.':(S.timeout>=8?'A long timeout holds threads and connections for a long time when the dependency is slow.':''));
    g+=H.gauge('Circuit breaker',S.breaker?T.bst:'off',null,!S.breaker?'info':T.bst==='open'?'warn':'ok',!S.breaker?'Without a breaker you keep calling a dependency that is failing.':T.bst==='open'?'Calls are cut off so the dependency can recover. A trial call is sent after a pause.':T.bst==='half'?'Sending a few trial calls.':'Closed: calls flow normally.');

    q('#g10').innerHTML=g;
    var v=okP>0.99?'Healthy.':s.extra>0.5&&dst==='bad'?'A retry storm: failures cause retries, which cause more failures.':S.breaker&&T.bst==='open'?'The breaker is open. Users get '+(S.shed?'a degraded page':'errors')+' while the dependency recovers.':okP>0.9?'Degraded.':'Outage for most users.';
    H.setText(root,'v10',v);
    SL.setMode(H.pct(okP)+' succeed');
  }
  function apply(o){
    if(o.reset){resetT();}
    if(o.load!==undefined)S.load=Number(o.load);if(o.slow!==undefined)S.slow=!!o.slow;

  }
  function act(k,v){
    if(k==='slow')S.slow=v==='slow';else if(k==='retries')S.retries=Number(v);else if(k==='backoff')S.backoff=v==='on';
    else if(k==='breaker')S.breaker=v==='on';else if(k==='limit')S.limit=v==='on';else if(k==='shed')S.shed=v==='on';

  }
  function initState(){S.load=60;S.slow=false;S.timeout=2;S.retries=0;S.backoff=false;S.breaker=false;S.limit=false;S.shed=false;}

  SL.add({id:10,short:'Reliability',title:'Reliability',
    tag:'At scale something is always failing. Timeouts, retries, circuit breakers and rate limits decide whether a small failure stays small.',
    sim:{html:HTML,init:function(el){initState();init(el);},update:update,apply:apply,act:act,destroy:destroy},
    steps:[
      {t:'Failures are normal',
       b:function(){return '<p>If one machine is up 99.9% of the time, a system that needs 100 such machines to all be up is available only about 90% of the time. Failure is not an exception at scale. It is the daily condition.</p><p>The goal is not "nothing fails". It is "a failure stays small". The simulator has your service calling one dependency, such as a payment provider or a recommendation service. You can make the dependency slow and watch what spreads.</p>';},
       tries:[{l:'Healthy baseline',reset:true,load:60,slow:false,retries:0,breaker:false,limit:false,shed:false,backoff:false,timeout:2}]},
      {t:'Always set a timeout',
       b:function(){return '<p>A call with no timeout can wait forever, holding a thread and a connection the whole time. When the dependency slows down, those pile up and your own service stops answering.</p><p>Choose a timeout slightly above the dependency\'s normal slow case. Too short and you fail healthy calls. Too long and failures tie up resources. Make the dependency slow and compare 2 s with 10 s.</p>';},
       tries:[{l:'Slow dependency, 2 s timeout',reset:true,slow:true,timeout:2,load:60,settle:20},{l:'10 s timeout',timeout:10,settle:20}]},
      {t:'Retries can start a storm',
       b:function(){return '<p>Retrying a failed call helps with brief glitches. When the dependency is overloaded, retries add load to the very thing that is struggling, and it fails more, causing more retries.</p><p>Set the dependency to healthy at 85% load. Everything works. Make it slow (half speed) with 3 immediate retries and watch the load shoot past 100%.</p>';},
       tries:[{l:'85% load, 3 retries, healthy',reset:true,slow:false,load:85,retries:3,backoff:false,settle:20},{l:'Dependency turns slow',slow:true,settle:20}]},
      {t:'Backoff and jitter',
       b:function(){return '<p>Spacing retries out (wait 1 s, then 2 s, then 4 s) reduces the pile-on. Adding random jitter stops thousands of clients retrying at the same instant. Capping the total retries per request keeps the work bounded.</p><p>Turn on backoff and compare how much extra load the retries create.</p>';},
       tries:[{l:'Immediate retries',backoff:false,settle:20},{l:'Backoff and jitter',backoff:true,settle:20}]},
      {t:'Circuit breakers and rate limits',
       b:function(){return '<p>A circuit breaker watches the failure rate. When it passes a threshold it opens: calls fail immediately without touching the dependency. After a pause it lets a few trial calls through, and closes again if they succeed. It gives a struggling service room to recover.</p><p>A rate limit caps how much you send. Together they protect the dependency from you.</p>';},
       tries:[{l:'Slow, 3 retries, no protection',reset:true,slow:true,load:85,retries:3,backoff:false,breaker:false,limit:false,settle:20},{l:'Add the breaker',breaker:true,settle:40},{l:'Add a rate limit',limit:true,settle:20}]},
      {t:'Degrade gracefully',
       b:function(){return '<p>When something non-essential fails, the page should still work. If recommendations are down, show popular items from a cache. If the payment provider is down, take the order and charge later.</p><p>Decide in advance which features are essential and which can be dropped. Then practice it. Turn on graceful degradation while the breaker is open and compare what users see.</p>';},
       tries:[{l:'Breaker on, slow dependency',reset:true,slow:true,breaker:true,load:70,retries:1,settle:60},{l:'Add graceful degradation',shed:true,settle:20}]},
      {t:'What you can take away',
       b:function(){return '<ul><li>Failure is normal. Contain it.</li><li>Set timeouts on every network call, and keep them short.</li><li>Retry only briefly and with backoff and jitter. Bound the total.</li><li>Use circuit breakers and rate limits so a slow service does not drag down its callers.</li><li>Decide in advance what to drop when things go wrong.</li></ul><p>Next level: put the pieces together on three classic designs.</p>';}}
    ],
    quiz:[
      {q:'A dependency is overloaded and slow. You add 3 immediate retries per call. What is the likely result?',o:['Users see fewer errors','Load rises further and the dependency fails harder: a retry storm','Nothing changes','The dependency recovers faster'],a:1,h:'Where do the extra calls go?',x:'Retries multiply load on the struggling service. Use backoff, jitter and a retry cap.'},
      {q:'What does an open circuit breaker do?',o:['Retries every call','Fails calls immediately so the dependency can recover','Doubles the timeout','Restarts the dependency'],a:1,h:'Think of a fuse.',x:'It stops sending traffic for a while, then tries a few trial calls before closing.'},
      {q:'Why is a missing timeout dangerous?',o:['It slows the first request','Calls to a slow dependency pile up and exhaust your threads and connections','It breaks encryption','It makes retries impossible'],a:1,h:'What holds a thread while it waits?',x:'Unbounded waits spread one slow dependency into your own outage.'},
      {q:'Recommendations are down. What is the best user experience?',o:['An error page','Show popular items from a cache and keep the page working','Keep retrying until it works','Redirect to the home page'],a:1,h:'Which feature is essential, and which is not?',x:'Graceful degradation keeps the core experience working when a non-essential part fails.'}
    ]});
})();

(function(){
  var H=SL.H;
  var S={cs:'url',dau:1000000,uv:50,fan:'hybrid',foll:200};
  var root=null;
  function q(s){return root.querySelector(s);}
  var CASES={url:'URL shortener',chat:'Chat service',feed:'News feed'};

  function calc(){
    var d=S.dau,r={rows:[],parts:[],gauges:[],verdict:''},peak=3,day=86400;
    if(S.cs==='url'){
      var wr=d*0.1/day,rd=wr*100,pr=rd*peak,pw=wr*peak,store=d*0.1*365*5*500/1e9;
      var keys=Math.pow(62,7),yr5=d*0.1*365*5;
      r.rows=[['New URLs per day',H.fmtC(d*0.1)],['Writes per second (peak)',H.fmtRps(pw)],['Redirects per second (peak)',H.fmtRps(pr)],['Read to write ratio','100 : 1'],['Storage after 5 years',H.fmtData(store)],['Keys used of 7 characters',(yr5/keys*100).toFixed(4)+'%']];
      r.parts=[['Load balancer + stateless app servers','Redirects are simple lookups.',true],
        ['Cache (key to long URL)','100:1 reads and a hot minority make the hit ratio high.',pr>2000],
        ['Key-value store, sharded by short code',H.fmtData(store)+' of small rows; reads by key only.',store>4000],
        ['Pre-generated key service','Avoids collisions and a lookup on every create.',true],
        ['Read replicas','Reads dominate; replicas add a standby.',pr>5000],
        ['Queue for click analytics','Do not slow the redirect to count clicks.',pr>1000]];
      r.gauges=[['Read load',pr,3000,'req/s on the lookup path'],['Storage',store,4000,'GB over 5 years']];
      r.verdict='Reads dominate by 100 to 1, so the whole design is about cheap, cacheable lookups. A redirect should return in a few milliseconds.';
    }else if(S.cs==='chat'){
      var msgs=d*40,mps=msgs/day*peak,conn=d*S.uv/100,srv=Math.ceil(conn/50000),store2=msgs*365*100/1e9;
      r.rows=[['Messages per day',H.fmtC(msgs)],['Messages per second (peak)',H.fmtRps(mps)],['Users online at peak ('+S.uv+'%)',H.fmtC(conn)],['Persistent connections per server','50,000'],['Gateway servers needed',H.fmtN(srv)],['Message storage per year',H.fmtData(store2)]];
      r.parts=[['Connection gateways (WebSocket)','Each user holds an open connection. Servers hold state, so users must be routed by connection.',true],
        ['Presence and routing store','Which gateway is each user connected to?',conn>10000],
        ['Message queue between gateways','Deliver to a user on another gateway; absorb bursts.',mps>200],
        ['Message store sharded by conversation','Reads are "latest messages in this chat", so partition by chat id.',store2>2000],
        ['Offline push notifications','Users who are not connected still need the message.',true],
        ['Delivery receipts with idempotent ids','At-least-once delivery means retries; clients must drop duplicates.',true]];
      r.gauges=[['Gateway servers',srv,2000,'servers'],['Write load',mps,50000,'messages/s']];
      r.verdict='The hard part is not throughput but holding '+H.fmtC(conn)+' open connections and routing each message to the right one.';
    }else{
      var posts=d*0.5/day*peak,loads=d*20/day*peak,fo=posts*S.foll,celeb=10000000;
      var perLoad=S.fan==='write'?1:S.fan==='read'?S.foll:1+10;
      var wFan=S.fan==='read'?posts:S.fan==='write'?fo:posts*S.foll*0.99;
      var rQ=loads*perLoad,celebW=S.fan==='read'?1:S.fan==='write'?celeb:1;
      r.rows=[['Posts per second (peak)',H.fmtRps(posts)],['Feed loads per second (peak)',H.fmtRps(loads)],['Average followers',String(S.foll)],['Timeline writes per second',H.fmtN(wFan)],['Lookups per feed load',String(perLoad)],['One celebrity post writes',H.fmtC(celebW)+' timelines']];
      r.parts=[['Post store','The source of truth for every post.',true],
        ['Precomputed timelines in a cache','Fan-out on write makes reading a feed one lookup.',S.fan!=='read'],
        ['Fan-out workers behind a queue','Writing '+H.fmtC(S.foll)+' timelines per post is background work.',S.fan!=='read'],
        ['Merge celebrity posts at read time','Writing 10M timelines for one post is too slow; pull those at read.',S.fan==='hybrid'],
        ['Ranking service','Order by relevance, not only time.',true],
        ['CDN for media','Images and video dominate bandwidth.',true]];
      r.gauges=[['Timeline write load',wFan,500000,'writes/s'],['Feed read load',rQ,100000,'lookups/s']];
      r.verdict=S.fan==='write'?'Reads are cheap. A celebrity post causes 10M writes at once.':S.fan==='read'?'Writes are cheap. Every feed load fans out to '+S.foll+' lookups, which is too slow.':'Normal users fan out on write. Celebrities are merged at read time. Each side avoids its worst case.';
    }
    return r;
  }
  var HTML=
    H.seg('cs','Design this',[{v:'url',l:'URL shortener'},{v:'chat',l:'Chat service'},{v:'feed',l:'News feed'}],'url')+
    H.usersSlider('u11',1000000,'Daily active users')+
    '<div id="ex11"></div>'+
    '<div id="rows11"></div>'+
    '<ul class="gauges" id="g11"></ul>'+
    '<label class="ctl">Components this design needs</label><div id="parts11"></div><p class="verdict" id="v11" aria-live="polite"></p>';

  function init(el){
    root=el;
    H.bind(el,{u11:function(v){S.dau=H.logU(v);SL.refresh();},uv11:function(v){S.uv=Number(v);SL.refresh();},fo11:function(v){S.foll=Number(v);SL.refresh();}});
  }
  function update(){
    var r=calc();
    H.syncSeg(root,'cs',S.cs);
    q('#u11').value=H.vOf(S.dau);H.setText(root,'u11V',H.fmtN(S.dau));
    var ex='';
    if(S.cs==='chat')ex=H.slider('uv11','Online at once (%)',1,30,S.uv);
    if(S.cs==='feed')ex=H.seg('fan','Fan-out strategy',[{v:'write',l:'On write'},{v:'read',l:'On read'},{v:'hybrid',l:'Hybrid'}],S.fan)+H.slider('fo11','Average followers',20,2000,S.foll,10);
    if(q('#ex11').getAttribute('data-cs')!==S.cs){q('#ex11').innerHTML=ex;q('#ex11').setAttribute('data-cs',S.cs);}
    if(S.cs==='feed')H.syncSeg(root,'fan',S.fan);
    if(S.cs==='chat'){H.setText(root,'uv11V',S.uv+'%');var e1=q('#uv11');if(e1)e1.value=S.uv;}
    if(S.cs==='feed'){H.setText(root,'fo11V',String(S.foll));var e2=q('#fo11');if(e2)e2.value=S.foll;}
    q('#rows11').innerHTML=H.table(['Estimate','Value'],r.rows.map(function(x){return {num:[1],c:[x[0],x[1]]};}));
    q('#g11').innerHTML=r.gauges.map(function(x){var f=x[1]/x[2];return H.gauge(x[0],H.fmtC(x[1])+' '+x[3],Math.min(1,f),f<0.5?'ok':f<1?'warn':'bad',f>=1?'One machine cannot do this. Split the work.':f>=0.5?'Getting close to what one machine can do.':'');}).join('');
    q('#parts11').innerHTML=H.table(['Component','Why','Needed'],r.parts.map(function(p){return {c:['<b>'+H.esc(p[0])+'</b>',H.esc(p[1]),p[2]?'yes':'not yet']};}));
    H.setText(root,'v11',r.verdict);
    SL.setMode(CASES[S.cs]);
  }
  function apply(o){
    if(o.cs)S.cs=o.cs;if(o.dau!==undefined)S.dau=Math.max(1,Math.round(Number(o.dau)));
    if(o.fan)S.fan=o.fan;if(o.foll!==undefined)S.foll=Number(o.foll);if(o.uv!==undefined)S.uv=Number(o.uv);
  }
  function act(k,v){
    if(k==='cs')S.cs=v;else if(k==='fan')S.fan=v;
  }
  function initState(){S.cs='url';S.dau=1000000;S.uv=50;S.fan='hybrid';S.foll=200;}

  SL.add({id:11,short:'Design walkthroughs',title:'Design walkthroughs',
    tag:'Put the pieces together on three classic problems. In each one, estimate first, find the bottleneck, then choose components that answer it.',
    sim:{html:HTML,init:function(el){initState();init(el);root.querySelector('#ex11').setAttribute('data-cs','');},update:update,apply:apply,act:act},
    steps:[
      {t:'A method that always works',
       b:function(){return '<ol><li><b>Clarify.</b> What does the product do? What matters most: speed, never losing data, cost?</li><li><b>Estimate.</b> Users to requests per second, bandwidth and storage.</li><li><b>Find the bottleneck.</b> Which number is biggest compared with one machine?</li><li><b>Sketch the simplest design</b> that handles it, then add pieces only where a number forces you to.</li><li><b>Stress it.</b> What fails? What is the single point of failure? What happens at 10× traffic?</li></ol><p>Each of the three cases below follows this order, using the pieces from earlier levels.</p>';}},
      {t:'URL shortener: reads dominate',dyn:true,
       b:function(){return '<p>Create a short link once, redirect to it many times. The redirect is the whole product, so it has to be fast and survive failures.</p><p>The key choice is how to make short codes: hash the long URL (collisions, repeats) or generate unique ids ahead of time and encode them in base 62. Seven characters give 3.5 trillion codes.</p><p>Look at the numbers: reads are 100 times writes, so a cache and replicas matter more than sharding at first.</p>';},
       tries:[{l:'URL shortener, 1M users',cs:'url',dau:1000000},{l:'100M users',dau:100000000}]},
      {t:'Chat: connections are the problem',dyn:true,
       b:function(){return '<p>Chat is not heavy on requests per second. It is heavy on open connections. Each online user holds a WebSocket to a gateway server, so gateways are stateful and the load balancer cannot send a message to any server.</p><p>To deliver a message you look up which gateway holds the recipient\'s connection, pass the message there through a queue, and write it to a store sharded by conversation. Offline users get a push notification.</p>';},
       tries:[{l:'Chat, 1M users',cs:'chat',dau:1000000},{l:'Chat, 100M users',dau:100000000}]},
      {t:'News feed: fan-out',dyn:true,
       b:function(){return '<p>When someone posts, who sees it? You can write the post into each follower\'s timeline (fan-out on write) or build the timeline when the follower opens the app (fan-out on read).</p><p>Write fan-out makes reads instant and a celebrity post becomes millions of writes. Read fan-out makes writes trivial and every feed load queries every followee. Real systems mix them: push for normal accounts, pull for celebrities.</p><p>Try each strategy and watch which load explodes.</p>';},
       tries:[{l:'Fan-out on write',cs:'feed',fan:'write',dau:10000000},{l:'Fan-out on read',fan:'read'},{l:'Hybrid',fan:'hybrid'}]},
      {t:'What you can take away',
       b:function(){return '<ul><li>Start with arithmetic. The biggest number tells you what to design around.</li><li>Different products fail in different places: reads (URL shortener), connections (chat), fan-out (feed).</li><li>The same toolbox solves each: cache, replicate, shard, queue, and stateless servers.</li><li>Explain the trade-off for every piece you add.</li></ul><p>Final level: do it yourself, against a clock.</p>';}}
    ],
    quiz:[
      {q:'For a URL shortener, which fact most shapes the design?',o:['Writes are 100 times reads','Reads are about 100 times writes','Storage is huge','Users need chat'],a:1,h:'How many times is a short link used after it is created?',x:'Redirects dominate, so cacheable lookups and read replicas matter most.'},
      {q:'Why can a load balancer not send a chat message to any gateway?',o:['Messages are encrypted','The recipient\'s open connection is on one specific gateway','Gateways are stateless','Servers cannot talk to each other'],a:1,h:'Where does the user\'s WebSocket live?',x:'Connections are stateful. You must find the gateway that holds the recipient\'s connection.'},
      {q:'A celebrity with 10M followers posts. What is the problem with pure fan-out on write?',o:['Reads become slow','It creates 10M timeline writes at once','It loses posts','It needs no cache'],a:1,h:'One post turns into how many writes?',x:'Hybrid designs pull celebrity posts at read time instead of pushing them to every follower.'},
      {q:'What should you do before drawing any boxes in a design interview?',o:['Choose a database','Clarify requirements and estimate the load','Pick a cloud provider','Write the API code'],a:1,h:'What tells you which component is needed?',x:'The numbers decide the design. Estimate first, then add components where the numbers force them.'}
    ]});
})();

(function(){
  var H=SL.H;
  var P={
    photo:{name:'Photo sharing app',brief:'People upload photos and follow others. 50M daily users each view 30 photos and upload 0.2 per day. An average photo is 2 MB.',dau:50e6,read:30,write:0.2,size:2,
      need:['lb','cache','cdn','blob','shard','queue'],skip:['sync'],bottleneck:'storage',
      note:'Photos are large and immutable, so object storage plus a CDN carries the load. Fan-out and thumbnailing run through a queue. Metadata is the part that gets sharded.'},
    ride:{name:'Ride hailing',brief:'Riders request cars and drivers update location every 4 seconds. 5M daily riders take 2 rides each. 1M drivers are online at peak.',dau:5e6,read:20,write:2,size:0.0002,extra:250000,
      need:['lb','cache','shard','queue','geo','replica'],skip:['cdn'],bottleneck:'writes',
      note:'Driver location updates are the heavy write stream (250k per second). Keep current positions in memory, partitioned by geographic cell, and write history asynchronously.'},
    docs:{name:'Collaborative docs',brief:'People edit shared documents together. 20M daily users each send about 200 small edits (1 KB each) a day and load documents about 100 times a day. Other editors must see an edit within a second.',dau:20e6,read:100,write:200,size:0.001,
      need:['lb','sticky','queue','replica','cache'],skip:['cdn'],bottleneck:'connections',
      note:'Each open document is a small real-time session. Route all editors of one document to the same server, merge edits there, and persist asynchronously.'}
  };
  var COMP=[
    ['lb','Load balancer + stateless app servers'],['cache','Cache'],['cdn','CDN for static and large files'],['blob','Object storage for large files'],
    ['replica','Read replicas'],['shard','Sharding'],['queue','Queue for background work'],['sticky','Route users to a specific server (stateful sessions)'],
    ['geo','Geospatial partitioning'],['sync','Synchronous cross-region replication on every write']
  ];
  var S={p:'photo',qps:'',store:'',bn:'',comps:{},t:45*60,run:false,shown:false};
  var root=null,timer=null;

  }

    var op=Math.max(0,10-over.length*5);
    out.push(['Avoided unnecessary parts',over.length?over.length+' extra: '+over.map(function(k){return label(k);}).join('; '):'none',op,10]);pts+=op;
    return {pts:pts,rows:out};
  }
  function label(k){var r='';COMP.forEach(function(c){if(c[0]===k)r=c[1];});return r;}
  function fmtT(s){var m=Math.floor(s/60),x=s%60;return (m<10?'0':'')+m+':'+(x<10?'0':'')+x;}

  var HTML=
    H.seg('p','Prompt',[{v:'photo',l:'Photo sharing'},{v:'ride',l:'Ride hailing'},{v:'docs',l:'Collaborative docs'}],'photo')+
    '<p id="br12"></p>'+
    '<div class="readouts"><div><div class="k">Time left</div><div class="v timer" id="tm12" style="font-size:24px">45:00</div></div><div><div class="k">Score</div><div class="v" id="sc12">—</div></div><div><div class="k">Rating</div><div class="v" id="rt12">—</div></div></div>'+
    '<div class="row"><button class="btn primary" id="st12" data-act="lvl" data-k="timer">Start the clock</button><button class="btn" data-act="lvl" data-k="reset">Clear answers</button></div>'+
    '<label class="ctl" for="qps12">1. Peak requests per second (reads + writes)</label><input class="field" id="qps12" type="number" min="0" placeholder="e.g. 25000">'+
    '<label class="ctl" for="sto12" style="margin-top:10px">2. New storage per year (TB)</label><input class="field" id="sto12" type="number" min="0" placeholder="e.g. 700">'+
    '<label class="ctl" for="bn12" style="margin-top:10px">3. The bottleneck</label><select id="bn12"><option value="">Choose…</option><option value="reads">Read throughput</option><option value="writes">Write throughput</option><option value="storage">Storage size</option><option value="connections">Open connections / stateful sessions</option></select>'+
    '<label class="ctl" style="margin-top:10px">4. Components you would use</label><div id="cp12"></div>'+
    '<div class="row"><button class="btn primary" data-act="lvl" data-k="grade">Check my design</button></div>'+

  function init(el){
    root=el;
    q('#qps12').addEventListener('input',function(e){S.qps=e.target.value;});
    q('#sto12').addEventListener('input',function(e){S.store=e.target.value;});
    q('#bn12').addEventListener('change',function(e){S.bn=e.target.value;});
    el.addEventListener('change',function(e){var k=e.target.getAttribute&&e.target.getAttribute('data-comp');if(k){S.comps[k]=e.target.checked;}});

    SL.setMode(S.run?'timer running':P[S.p].name);
  }
  function apply(o){
    if(o.p){S.p=o.p;S.qps='';S.store='';S.bn='';S.comps={};S.shown=false;buildComps();}
    if(o.qps!==undefined)S.qps=String(o.qps);if(o.store!==undefined)S.store=String(o.store);if(o.bn!==undefined)S.bn=o.bn;
    if(o.comps){S.comps={};o.comps.forEach(function(k){S.comps[k]=true;});buildComps();}
    if(o.grade)S.shown=true;
  }
  function act(k,v){
    if(k==='p'){apply({p:v});}
    else if(k==='timer'){S.run=!S.run;if(S.t<=0)S.t=45*60;}
    else if(k==='reset'){S.qps='';S.store='';S.bn='';S.comps={};S.shown=false;S.t=45*60;S.run=false;buildComps();}
    else if(k==='grade'){S.shown=true;}
  }
  function initState(){S.p='photo';S.qps='';S.store='';S.bn='';S.comps={};S.t=45*60;S.run=false;S.shown=false;}

  SL.add({id:12,short:'Capstone',title:'Capstone',
    tag:'Design a system in 45 minutes. Estimate, find the bottleneck, choose components, then see how your answer compares.',
    sim:{html:HTML,init:function(el){initState();init(el);},update:update,apply:apply,act:act,destroy:destroy},
    steps:[
      {t:'How to run it',
       b:function(){return '<p>Pick a prompt in the panel and start the clock. Work in this order, as in a real design discussion:</p><ol><li>Reread the brief and write down the numbers it gives you.</li><li>Estimate peak requests per second and yearly storage. Show your arithmetic on paper.</li><li>Name the one resource that will break first.</li><li>Choose only the components that answer that problem.</li></ol><p>Then check your design. The score rewards good estimates, finding the real bottleneck and restraint.</p>';}},
      {t:'Useful numbers to remember',
       b:function(){return H.table(['Fact','Value'],[
         {c:['Seconds in a day','86,400 (use 100,000 for quick math)']},
         {c:['1M requests a day','about 12 per second']},
         {c:['Peak vs. average','2 to 5×']},
         {c:['One app server','a few hundred to a few thousand req/s']},
         {c:['One database node','several thousand simple queries/s']},
         {c:['Memory read','~100 ns, SSD ~100 µs, same-zone network ~0.5 ms, cross-region ~50+ ms']},
         {c:['1 million × 1 KB','1 GB']}])+'<p>Round aggressively. The goal is the right order of magnitude, and the score allows a factor of three.</p>';}},
      {t:'Common traps',
       b:function(){return '<ul><li><b>Over-engineering.</b> Adding sharding to a system that fits on one database.</li><li><b>Ignoring the biggest number.</b> Designing for queries per second when connections or storage is the real limit.</li><li><b>Forgetting failure.</b> Every box you add is a new single point of failure unless you duplicate it.</li><li><b>Skipping trade-offs.</b> For every choice, say what it costs.</li></ul><p>Try the three prompts. The scoring panel shows what you missed.</p>';}},
      {t:'Where to go next',
       b:function(){return '<p>You have covered the core toolbox: stateless servers and load balancing, databases, caching, replication, sharding, queues, consistency, failure handling and end-to-end design.</p><p>Natural next topics: observability (metrics, logs, traces), deployments and rollbacks, security and abuse, multi-region design, cost control, search and indexing, and stream processing. Each can become a new level on this page.</p>';}}
    ],
    quiz:[
      {q:'Which comes first when you answer a design question?',o:['Draw the final architecture','Clarify requirements and estimate the load','Pick technologies','List every database you know'],a:1,h:'What tells you which components you need?',x:'Estimates drive the design.'},
      {q:'You estimate 500 requests per second and 2 TB of data. What is the most reasonable design?',o:['Sharded database with multi-region replication','A simple stateless app tier with one database, a replica for safety, and backups','A microservice per table','Ten Kafka clusters'],a:1,h:'Do the numbers force anything exotic?',x:'Those numbers fit comfortably on a modest setup. Extra parts add cost and failure modes.'},
      {q:'When explaining a component choice, what should you always add?',o:['Its brand name','What it costs you: a trade-off or a new failure mode','Its release date','Who else uses it'],a:1,h:'Every choice has a downside.',x:'Naming the trade-off shows you understand why you chose it.'}
    ]});
})();
