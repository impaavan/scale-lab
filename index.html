<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Scale Lab: an interactive system design course in 12 levels, from one user on one server to a timed capstone.">
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Scale Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  /* Layout: a live instrument panel (simulator) beside a lesson stepper. Stacks on phones. */
  --bg:#ECEFE9; --surface:#F8F9F5; --ink:#15211C; --ink-2:#4B5A53; --line:#CAD1C8;
  --accent:#0A6C88; --accent-ink:#FFFFFF; --ok:#27804A; --warn:#96640A; --bad:#C23A2C;
  --grid:rgba(21,33,28,.07);
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1512; --surface:#141E1A; --ink:#E5ECE7; --ink-2:#9BADA4; --line:#2A3A34;
    --accent:#4CC3E0; --accent-ink:#06222B; --ok:#58C47C; --warn:#E6B73C; --bad:#FF7262;
    --grid:rgba(229,236,231,.06); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1512; --surface:#141E1A; --ink:#E5ECE7; --ink-2:#9BADA4; --line:#2A3A34;
  --accent:#4CC3E0; --accent-ink:#06222B; --ok:#58C47C; --warn:#E6B73C; --bad:#FF7262;
  --grid:rgba(229,236,231,.06); color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:16px; line-height:1.55;
  background-image:radial-gradient(var(--grid) 1px,transparent 1px); background-size:18px 18px;
  padding-block:20px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
}
.wrap{width:100%;max-width:none;margin:0;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.1}
h1{font-size:clamp(30px,6vw,44px);font-weight:800;letter-spacing:-.01em}
h2{font-size:clamp(24px,4.4vw,34px);font-weight:800}
h3{font-size:19px;font-weight:600}
p{margin:0 0 10px;max-width:65ch}
ul,ol{margin:0 0 10px;padding-left:20px;max-width:65ch}
li{margin-bottom:4px}
.eyebrow{font:400 12px var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2);margin:0 0 6px}
.small{font-size:13px;color:var(--ink-2)}
.mono{font-family:var(--f-mono)}

.top{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;justify-content:space-between}
.top p{margin:6px 0 0;color:var(--ink-2)}
.prog{min-width:200px;flex:0 1 260px}
.prog .bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:6px}
.prog .bar i{display:block;height:100%;background:var(--accent);width:0}

.levels{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.chip{flex:0 0 auto;display:flex;gap:8px;align-items:center;min-height:44px;padding:6px 12px 6px 8px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink);border-radius:4px;font:500 13px var(--f-body);cursor:pointer;text-align:left}
.chip b{font:500 12px var(--f-mono);display:grid;place-items:center;width:26px;height:26px;border:1px solid var(--line);border-radius:50%}
.chip.done b{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.chip[aria-current="true"]{border-color:var(--accent);box-shadow:inset 0 -3px 0 var(--accent)}
.chip[aria-current="true"] b{border-color:var(--accent);color:var(--accent)}
.chip.done[aria-current="true"] b{color:var(--surface)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px;min-width:0}
.panel>.eyebrow{display:flex;justify-content:space-between;gap:8px}
.grid{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
@media (min-width:1500px){body{padding-left:max(40px,env(safe-area-inset-left,0px));padding-right:max(40px,env(safe-area-inset-right,0px))}}
@media (min-width:900px){
  .grid{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);align-items:start}
  .sim{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow-y:auto}
}
.head p{color:var(--ink-2);margin-top:8px;font-size:17px}

/* shared sim parts */
.spec{font:400 12px var(--f-mono);color:var(--ink-2);margin:0 0 12px}
.readouts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;border-block:1px solid var(--line);padding-block:10px;margin-bottom:14px}
.readouts div{min-width:0}
.readouts .k{font:400 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.readouts .v{font:500 19px var(--f-mono);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
label.ctl{display:block;font:500 12px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);margin-bottom:6px}
.ctlrow{margin:10px 0}
.ctlrow label.ctl{display:flex;justify-content:space-between;gap:8px;margin-bottom:0}
.cv{color:var(--ink);text-transform:none;letter-spacing:0;font-weight:500}
input[type=range]{width:100%;accent-color:var(--accent);height:32px;margin:0}
.ticks{display:flex;justify-content:space-between;font:400 11px var(--f-mono);color:var(--ink-2);margin-top:-2px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px}
.btn{font:500 13px var(--f-mono);min-height:40px;padding:6px 12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:4px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger[aria-pressed="true"],.btn.danger.on{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.mini{min-height:32px;padding:3px 8px;font-size:12px}
.btn:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible,summary:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.st-ok{--st:var(--ok)}.st-warn{--st:var(--warn)}.st-bad{--st:var(--bad)}.st-info{--st:var(--ink-2)}

.gauges{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:10px;max-width:none}
.g{border-top:1px solid var(--line);padding-top:8px}
.g .top2{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.g .n{font-weight:600;font-size:14px}
.g .val{font:400 12px var(--f-mono);color:var(--ink-2);font-variant-numeric:tabular-nums}
.meter{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:6px 0}
.meter i{display:block;height:100%;background:var(--st,var(--accent));width:0;transition:width .25s}
.pill{font:500 10.5px var(--f-mono);letter-spacing:.06em;padding:1px 7px;border-radius:3px;color:var(--st);border:1px solid var(--st);background:color-mix(in srgb,var(--st) 12%,transparent)}
.why{font-size:13px;color:var(--ink-2);margin:2px 0 0}
.verdict{margin-top:14px;padding:10px 12px;border-left:3px solid var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent);font-size:14px;max-width:none}
details{margin-top:14px;font-size:14px}
summary{cursor:pointer;font:500 12px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);min-height:32px}
.assume{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:8px}
.assume label{font-size:12px;color:var(--ink-2);display:flex;flex-direction:column;gap:4px}
.assume input{font:400 14px var(--f-mono);padding:6px 8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:4px;min-width:0;width:100%}

.nodes{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin:10px 0}
.nd{border:1px solid var(--st,var(--line));border-radius:4px;padding:8px;background:var(--bg);font-size:12px;min-width:0}
.nd b{font:600 13px var(--f-body);display:block}
.nd .meter{margin:6px 0}
.nd .sub{font:400 11px var(--f-mono);color:var(--ink-2);display:block;overflow-wrap:anywhere}
.nd.dead{opacity:.55;border-style:dashed}
.flow{display:flex;flex-wrap:wrap;align-items:stretch;gap:6px;margin:8px 0}
.flow .nd{flex:1 1 90px}
.flow .arr{align-self:center;color:var(--ink-2);font:500 14px var(--f-mono)}
.stack{display:flex;height:10px;border-radius:3px;overflow:hidden;background:var(--line);margin:6px 0}
.stack i{display:block;height:100%}
.legend{display:flex;gap:12px;flex-wrap:wrap;font:400 11px var(--f-mono);color:var(--ink-2)}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;margin-right:5px;background:var(--c);border-radius:2px}
.log{font:400 12px var(--f-mono);list-style:none;padding:0;margin:8px 0;max-width:none}
.log li{padding:5px 0;border-top:1px solid var(--line);margin:0}
select,textarea,.field{font:400 14px var(--f-body);padding:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:4px;width:100%}
textarea{min-height:72px;resize:vertical}
svg.chart{width:100%;height:auto;display:block}
svg.chart text{font:400 10px var(--f-mono);fill:var(--ink-2)}
svg.chart .ax{stroke:var(--line);stroke-width:1;fill:none}
svg.chart .ln{fill:none;stroke:var(--accent);stroke-width:2}
svg.chart .ln2{fill:none;stroke:var(--ok);stroke-width:2}
svg.chart .ln3{fill:none;stroke:var(--bad);stroke-width:2}
svg.chart .hl{stroke:var(--ink-2);stroke-dasharray:3 3;stroke-width:1}
svg.chart .band{fill:var(--bad);opacity:.12}
svg.chart .pt{fill:var(--st,var(--accent));stroke:var(--surface);stroke-width:2}

/* lesson */
.steps{display:flex;gap:6px;margin:6px 0 14px;flex-wrap:wrap}
.steps button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font:500 12px var(--f-mono);color:var(--ink);cursor:pointer}
.steps button[aria-current="step"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.lesson h3{margin-bottom:10px}
.nav{display:flex;justify-content:space-between;gap:8px;margin-top:16px}
table{border-collapse:collapse;width:100%;font-size:13px}
.tw{overflow-x:auto;margin:8px 0 12px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:500 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
td.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
tr.hit td{color:var(--bad)}
.calc{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;font-size:14px;margin:8px 0 12px}
.calc span:nth-child(even){font-family:var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
.calc .tot{font-weight:600}
.opts{display:flex;flex-direction:column;gap:8px;margin:8px 0}
.opt{text-align:left;min-height:44px;padding:8px 12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:4px;font:400 15px var(--f-body);cursor:pointer}
.opt:hover{border-color:var(--accent)}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.opt.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.fb{font-size:14px;margin:6px 0 0;max-width:none}
.q{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
.q:first-of-type{border-top:0;margin-top:6px;padding-top:0}
.q p.qt{font-weight:600}
.done-banner{margin-top:14px;padding:12px;border:1px solid var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent);border-radius:4px;max-width:none}
.phase{border-top:1px solid var(--line);padding:10px 0}
.phase.now{border-left:3px solid var(--accent);padding-left:10px}
.phase h4{margin:0 0 6px;font:600 14px var(--f-body);display:flex;justify-content:space-between;gap:8px}
.phase h4 span{font:400 12px var(--f-mono);color:var(--ink-2)}
.timer{font:500 34px var(--f-mono);font-variant-numeric:tabular-nums}
footer{font-size:13px;color:var(--ink-2);max-width:70ch}
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Scale Lab</h1>
      <p>System design from zero to hero. One simulator, one lesson and one quiz per level.</p>
    </div>
    <div class="prog" aria-live="polite">
      <div class="small mono" id="progText">0 of 12 levels complete</div>
      <div class="bar"><i id="progBar"></i></div>
    </div>
  </header>

  <nav class="levels" id="levels" aria-label="Levels"></nav>

  <section class="head">
    <p class="eyebrow" id="lvEyebrow"></p>
    <h2 id="lvTitle"></h2>
    <p id="lvTag"></p>
  </section>

  <div class="grid">
    <section class="panel sim" aria-label="Simulator">
      <p class="eyebrow"><span>Simulator</span><span id="simMode"></span></p>
      <div id="simHost"></div>
    </section>
    <section class="panel lesson" aria-label="Lesson">
      <p class="eyebrow"><span>Lesson</span><span id="stepCount"></span></p>
      <div class="steps" id="steps" role="group" aria-label="Lesson steps"></div>
      <div id="stepBody"></div>
      <div class="nav">
        <button class="btn" data-act="prev" id="prevBtn">Back</button>
        <button class="btn primary" data-act="next" id="nextBtn">Next</button>
      </div>
    </section>
  </div>

  <section class="panel" aria-label="Checkpoint">
    <p class="eyebrow"><span>Checkpoint</span><span id="quizCount"></span></p>
    <div id="quiz"></div>
    <div id="quizDone"></div>
  </section>

  <footer>Progress is saved in this browser only. Numbers come from simplified models so the trade-offs are easy to see. Real systems need load tests.</footer>
</div>

<script>
/* ===== Scale Lab core ===== */
(function(){
  var SL=window.SL={levels:[],H:{}},H=SL.H;
  var $=function(s){return document.querySelector(s);};
  H.$=$;
  H.esc=function(t){return String(t).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};
  H.fmtC=function(n){
    if(n>=1e12)return (n/1e12).toFixed(1).replace(/\.0$/,'')+'T';
    if(n>=1e9)return (n/1e9).toFixed(1).replace(/\.0$/,'')+'B';
    if(n>=1e6)return (n/1e6).toFixed(n>=1e7?0:1).replace(/\.0$/,'')+'M';
    if(n>=1e3)return (n/1e3).toFixed(n>=1e5?0:1).replace(/\.0$/,'')+'k';
    return String(Math.round(n));
  };
  H.fmtN=function(n){return Math.round(n).toLocaleString('en-US');};
  H.fmtRps=function(r){return r<0.1?'<0.1':r<10?r.toFixed(1):H.fmtN(r);};
  H.fmtMs=function(ms){return ms>=30000?'timeout':ms>=1000?(ms/1000).toFixed(1)+' s':ms<10?ms.toFixed(1)+' ms':Math.round(ms)+' ms';};
  H.fmtGB=function(g){return g<10?g.toFixed(1):H.fmtN(g);};
  H.fmtData=function(gb){return gb>=1000?(gb/1000).toFixed(gb>=10000?0:1).replace(/\.0$/,'')+' TB':gb>=10?Math.round(gb)+' GB':gb.toFixed(1)+' GB';};
  H.fmtDur=function(sec){
    if(sec<1)return '<1 s'; if(sec<90)return Math.round(sec)+' s';
    if(sec<5400)return Math.round(sec/60)+' min'; if(sec<172800)return (sec/3600).toFixed(1).replace(/\.0$/,'')+' h';
    return Math.round(sec/86400)+' days';
  };
  H.money=function(n){return '$'+Math.round(n).toLocaleString('en-US');};
  H.pct=function(x){return Math.round(x*100)+'%';};
  H.peakRps=function(u){return u*50*3/86400;};
  H.logU=function(v){return Math.max(1,Math.round(Math.pow(10,Number(v)/100)));};
  H.vOf=function(u){return Math.round(Math.log10(Math.max(1,u))*100);};
  H.worst=function(a){return a.indexOf('bad')>-1?'bad':a.indexOf('warn')>-1?'warn':'ok';};
  H.clamp=function(x,a,b){return Math.min(b,Math.max(a,x));};
  H.prng=function(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};};
  H.hash=function(x){x=Math.imul((x|0)^((x|0)>>>16),0x45d9f3b);x=Math.imul(x^(x>>>16),0x45d9f3b);return (x^(x>>>16))>>>0;};

  H.slider=function(id,label,min,max,val,step){
    return '<div class="ctlrow"><label class="ctl" for="'+id+'"><span>'+label+'</span><span class="cv" id="'+id+'V"></span></label><input type="range" id="'+id+'" min="'+min+'" max="'+max+'" step="'+(step||1)+'" value="'+val+'"></div>';
  };
  H.usersSlider=function(id,u,label){
    return '<div class="ctlrow"><label class="ctl" for="'+id+'"><span>'+(label||'Daily active users')+'</span><span class="cv" id="'+id+'V"></span></label><input type="range" id="'+id+'" min="0" max="700" step="1" value="'+H.vOf(u)+'"><div class="ticks" aria-hidden="true"><span>1</span><span>100</span><span>10k</span><span>1M</span><span>10M</span></div></div>';
  };
  H.seg=function(k,label,opts,cur){
    return (label?'<label class="ctl">'+label+'</label>':'')+'<div class="seg" role="group" aria-label="'+H.esc(label||k)+'">'+opts.map(function(o){
      return '<button class="btn" data-act="lvl" data-k="'+k+'" data-v="'+o.v+'" aria-pressed="'+(String(o.v)===String(cur))+'">'+o.l+'</button>';
    }).join('')+'</div>';
  };
  H.syncSeg=function(root,k,cur){
    var bs=root.querySelectorAll('[data-act="lvl"][data-k="'+k+'"]');
    for(var i=0;i<bs.length;i++)bs[i].setAttribute('aria-pressed',String(bs[i].getAttribute('data-v')===String(cur)));
  };
  H.setText=function(root,id,t){var e=root.querySelector('#'+id);if(e)e.textContent=t;};
  H.setVal=function(root,id,v){var e=root.querySelector('#'+id);if(e)e.value=v;};
  H.bind=function(root,map){
    root.addEventListener('input',function(e){var f=map[e.target.id];if(f)f(e.target.value,e);});
  };
  H.gauge=function(name,val,frac,st,txt,label){
    var lab=label||(st==='ok'?'OK':st==='warn'?'WATCH':st==='bad'?'BREAKS':'INFO');
    return '<li class="g st-'+st+'"><div class="top2"><span class="n">'+name+'</span><span class="val">'+H.esc(val)+'</span><span class="pill">'+lab+'</span></div>'+
      (frac===null?'':'<div class="meter"><i style="width:'+Math.round(H.clamp(frac,0,1)*100)+'%"></i></div>')+
      (txt?'<p class="why">'+H.esc(txt)+'</p>':'')+'</li>';
  };
  H.stack=function(segs){return '<div class="stack">'+segs.map(function(s){return '<i style="width:'+s.w.toFixed(1)+'%;background:'+s.c+'"></i>';}).join('')+'</div>';};
  H.table=function(head,rows){
    return '<div class="tw"><table><thead><tr>'+head.map(function(h){return '<th>'+h+'</th>';}).join('')+'</tr></thead><tbody>'+
      rows.map(function(r){return '<tr'+(r.cls?' class="'+r.cls+'"':'')+'>'+r.c.map(function(c,i){return '<td'+(r.num&&r.num.indexOf(i)>-1?' class="num"':'')+'>'+c+'</td>';}).join('')+'</tr>';}).join('')+
      '</tbody></table></div>';
  };
  H.chart=function(o){
    var w=o.w||320,h=o.h||170,L=o.l||38,R=o.r||16,T=o.t||12,B=o.b||30,x0=o.xmin||0,span=(o.xmax-x0)||1;
    function X(x){return L+(x-x0)/span*(w-L-R);}
    function Y(y){return h-B-Math.min(Math.max(y,0),o.ymax)/(o.ymax||1)*(h-B-T);}
    var s='<svg class="chart" viewBox="0 0 '+w+' '+h+'" role="img" aria-label="'+H.esc(o.aria||'Chart')+'">';

    var pts=[];for(var r=0;r<=0.99;r+=0.01)pts.push([r,Math.min(2000,3*m.base/(1-r))]);
    var rho=Math.min(m.cpu,0.99),st=m.cpu<0.7?'ok':m.cpu<1?'warn':'bad';
    return H.chart({w:320,h:170,xmax:1,ymax:2000,series:[{pts:pts}],hlines:[{y:500,l:'500 ms goal'}],
      xticks:[{x:0,l:'0%'},{x:0.5,l:'50%'},{x:1,l:'100%'}],yticks:[{y:0,l:'0'},{y:1000,l:'1 s'},{y:2000,l:'2 s'}],xlabel:'CPU busy',
      point:{x:rho,y:Math.min(2000,3*m.base/(1-rho)),st:st},aria:'p95 response time against CPU utilization. Flat until about 70 percent, then climbing steeply.'})+
      '<p class="small">Right now: '+H.pct(m.cpu)+' busy, p95 '+H.fmtMs(m.p95)+'.</p>';
  }

  SL.add({id:1,short:'One user, one server',title:'One user, one server',
    tag:'Start with the smallest system that works. See what it gives you and where it is already fragile.',
    sim:mk(1),
    steps:[
      {t:'The smallest system that works',
       b:function(){return '<p>One machine runs everything: your app code, your database and your files. A request comes in, the app reads the database sitting next to it, and the page goes back out.</p><p>The panel is a live model of that machine. At one user, every gauge sits close to zero.</p>';},
       tries:[{l:'Set to 1 user',users:1,plug:false}]},
      {t:'What works',
       b:function(){return '<ul><li><b>Speed.</b> The app talks to the database on the same machine, so there is no network hop. A request takes about 15 ms in this model.</li><li><b>Simplicity.</b> One thing to deploy, one log to read, no copies of data to keep in sync.</li><li><b>Cost.</b> About '+H.money(SIZES.S.cost)+' a month for this box.</li></ul><p>Push the slider to 1,000 users. Nothing changes.</p>';},
       tries:[{l:'Try 1,000 users',users:1000,plug:false}]},
      {t:'What is already fragile',
       b:function(){return '<p>Some problems exist even with one user. Traffic does not cause them.</p><ul><li>If the machine crashes, reboots or is being deployed to, the whole app is down.</li><li>If the disk fails, the data is gone unless a backup lives somewhere else.</li><li>The app and the database share one CPU and one pool of RAM, so a busy app slows the database.</li></ul><p>Pull the plug and look at the diagram.</p>';},
       tries:[{l:'Pull the plug',plug:true},{l:'Plug it back in',plug:false}]},
      {t:'The rule to carry forward',
       b:function(){return '<p>Start with the simple box on purpose. Every piece you add later buys something and costs something. Add pieces when a number forces you to, not because a diagram looks more serious with more boxes.</p><p>At 10,000 daily users this box is still comfortable. The next level asks how far it really goes.</p>';},
       tries:[{l:'Try 10,000 users',users:10000,plug:false}]}
    ],
    quiz:[
      {q:'What is the main advantage of starting with a single server?',o:['It scales to any traffic','Nothing to coordinate: simple to run, debug and pay for','It never goes down','It needs no backups'],a:1,h:'Think about what you have to keep in sync with only one machine.',x:'One machine means one deploy, one log and no data to keep consistent. It does not scale far and it can go down.'},
      {q:'The server crashes. What happens to your app?',o:['Traffic moves to a backup automatically','Only the database is affected','Everything is down until it is fixed','Only new users are affected'],a:2,h:'Ask what else could take over.',x:'There is nothing else. One machine is a single point of failure.'},
      {q:'Why is the database call so fast in this design?',o:['Databases are always fast','There is no network hop, but the app and database compete for the same CPU and RAM','Data is cached in the browser','The disk is faster than RAM'],a:1,h:'Where does the database live relative to the app?',x:'A local call skips the network. The price is shared resources.'}
    ]});

  SL.add({id:2,short:'A million users, one server',title:'A million users, one server',
    tag:'Keep the same single box and add traffic. Do the arithmetic, predict the breaking point, then watch what fails first.',
    sim:mk(1000000),
    steps:[
      {t:'Do the math first',dyn:true,
       b:function(){var m=model(S.users,S.size,S.a),a=S.a;
         return '<p>System design starts with arithmetic. These numbers tell you which resource to worry about before you draw a box.</p><div class="calc">'+
         '<span>'+H.fmtN(m.users)+' users × '+a.reqPerUser+' requests a day</span><span>'+H.fmtC(m.perDay)+' / day</span>'+
         '<span>÷ 86,400 seconds in a day</span><span>'+H.fmtRps(m.avg)+' req/s avg</span>'+
         '<span class="tot">× '+a.peak+' for the busiest hours</span><span class="tot">'+H.fmtRps(m.rps)+' req/s peak</span>'+
         '<span>× '+a.respKB+' KB per response</span><span>'+H.fmtN(m.mbps)+' Mbps</span>'+
         '<span>× 50 KB of stored data per user</span><span>'+H.fmtGB(m.dataGB)+' GB</span></div><p class="small">Change the assumptions under the simulator and watch these lines move.</p>';},
       tries:[{l:'Set to 1,000,000 users',users:1000000,plug:false}]},
      {t:'Predict, then look',
       b:function(){
         var opts=[10000,150000,1000000,10000000],actual=breakpoints(S.size,S.a).cpu||1e9,best=0,bd=1e9;
         opts.forEach(function(o,i){var d=Math.abs(Math.log(o/actual));if(d<bd){bd=d;best=i;}});
         var h='<p>The small server has 2 cores. Each core handles 125 requests per second. With 50 requests per user per day and a 3× peak, about how many daily users until the CPU is fully used?</p><div class="opts">';
         opts.forEach(function(o,i){
           var cls='opt';if(S.pred!==null){if(i===best)cls+=' right';else if(i===S.pred)cls+=' wrong';}
           h+='<button class="'+cls+'" data-act="lvl" data-k="pred" data-v="'+i+'" '+(S.pred!==null?'disabled':'')+'>About '+H.fmtC(o)+' users</button>';
         });
         h+='</div>';
         if(S.pred!==null){
           h+='<p class="fb">'+(S.pred===best?'Right. ':'Not quite. ')+'The model puts it at '+bpText(actual)+'. This box handles '+H.fmtN(SIZES[S.size].cores*RPS_CORE)+' req/s, and each user adds '+(S.a.reqPerUser*S.a.peak/86400).toFixed(4)+' req/s at peak, so the CPU runs out near '+H.fmtC(actual)+'.</p><div class="row"><button class="btn primary" data-act="lvl" data-k="try" data-v="'+H.esc(JSON.stringify({users:actual}))+'">Show me at that point</button></div>';
         }
         return h;},
       tries:[]},
      {t:'Watch what breaks, in order',dyn:true,
       b:function(){var m=model(S.users,S.size,S.a),bp=breakpoints(S.size,S.a);
         var list=KEYS.map(function(k){return {k:k,u:bp[k]};}).sort(function(x,y){return (x.u||1e12)-(y.u||1e12);});
         var rows=list.map(function(r){var hit=r.u!==undefined&&r.u<=m.users;return {cls:hit?'hit':'',num:[1],c:[NAMES[r.k],r.u===undefined?'not before 1B':H.fmtC(r.u),hit?'broken now':'fine now']};});
         return '<p>Drag the slider slowly from 1,000 up to 1,000,000. The table shows the user count where each gauge first turns red on the current server.</p>'+
         H.table(['Resource','Breaks at','At '+H.fmtC(m.users)],rows)+
         '<p>CPU, response time and connections fail together because they share one cause. Disk and cache fail later because data grows with users. Some resources may never break at your scale, and knowing which ones saves you from fixing the wrong thing.</p>';},
       tries:[{l:'Set to 1,000,000 users',users:1000000,plug:false}]},
      {t:'Why latency explodes',dyn:true,
       b:function(){var m=model(S.users,S.size,S.a);
         return '<p>Response time does not rise in a straight line. Requests wait in a queue for a free core. Below about 70% CPU the queue is short. Past 90% each extra percent of load adds a lot of waiting.</p><p>This is why teams size servers to run at 40 to 60% busy. The headroom is what keeps the queue short.</p>'+curveSvg(m);},
       tries:[{l:'Try 60% busy',users:'u60'},{l:'Try 95% busy',users:'u95'}]},
      {t:'Try the obvious fix: a bigger box',dyn:true,
       b:function(){
         var rows=Object.keys(SIZES).map(function(k){var s=SIZES[k],fb=firstBreak(k,S.a);return {num:[2,3],c:[s.name,s.cores+' vCPU, '+s.ram+' GB',H.money(s.cost),fb?H.fmtC(fb.u):'none']};});
         return '<p>Buying a bigger machine is called vertical scaling. Try each size at 1,000,000 users.</p>'+H.table(['Size','Specs','Per month','First failure'],rows)+
         '<ul><li>It buys headroom fast, with no code changes.</li><li>Price rises roughly with size, and there is a largest machine you can rent.</li><li>It is still one machine. Pull the plug on the Huge box and everything is still down.</li></ul>';},
       tries:[{l:'Small',size:'S',users:1000000},{l:'Medium',size:'M',users:1000000},{l:'Large',size:'L',users:1000000},{l:'Huge',size:'XL',users:1000000},{l:'Pull the plug',plug:true}]},
      {t:'What you can take away',
       b:function(){return '<ul><li>Estimate first: daily users become requests per second, bandwidth and storage.</li><li>One box fails at the resource whose demand grows fastest. Find that resource.</li><li>Latency collapses before utilization hits 100%.</li><li>Bigger boxes delay the problem. They do not remove the single point of failure.</li></ul><p>Next level: more than one server, a load balancer in front, and why your app servers must stop remembering things between requests.</p>';}}
    ],
    quiz:[
      {q:'1,000,000 daily users, 50 requests each, peak at 3× average. About how many requests per second at peak?',o:['About 580','About 1,700','About 17,000','About 50,000'],a:1,h:'Divide by 86,400 seconds, then multiply by the peak factor.',x:'50M requests ÷ 86,400 is about 580 per second on average. Times 3 is about 1,740 at peak.'},
      {q:'Why does response time shoot up as CPU approaches 100%?',o:['The network gets slower','Requests queue for a free core, and waiting grows faster than load','Disks get fragmented','The database deletes old data'],a:1,h:'Think about a checkout line with one cashier.',x:'Near full utilization every new request waits behind others, so delay climbs steeply.'},
      {q:'What does buying a bigger server fix?',o:['The single point of failure','It buys headroom, but cost keeps climbing, there is a ceiling, and one box can still fail','Nothing at all','Network latency to users'],a:1,h:'Does a bigger machine become two machines?',x:'Vertical scaling is a real and useful first step. It does not add redundancy.'}
    ]});
})();
/* ===== Level 3: more than one server ===== */
(function(){
  var H=SL.H,CAP=250,HEAVY=40,NREQ=600,SERVER_COST=45;
  var S={users:300000,n:3,algo:'rr',heavy:10,sess:'stateful',health:true,lb:1,down:{}};
  var root=null,cache={};
  function q(s){return root.querySelector(s);}

  function dist(algo,ids,heavy){
    var key=algo+'|'+ids.join(',')+'|'+heavy;if(cache[key])return cache[key];
    var r=H.prng(11),load={},tot=0,i,target;
    ids.forEach(function(x){load[x]=0;});
    for(i=0;i<NREQ;i++){
      var cost=r()<heavy/100?HEAVY:1;
      if(algo==='rr'){target=ids[i%ids.length];}
      else if(algo==='least'){target=ids[0];ids.forEach(function(x){if(load[x]<load[target])target=x;});}
      else{var u=Math.floor(Math.pow(r(),3)*300);target=ids[(Math.imul(u,2654435761)>>>0)%ids.length];}
      load[target]+=cost;tot+=cost;
    }
    var out={};ids.forEach(function(x){out[x]=load[x]/tot;});
    cache[key]=out;return out;
  }
  function calc(){
    var n=S.n,rps=H.peakRps(S.users),idx=[],i;
    for(i=0;i<n;i++)idx.push(i);
    var downL=idx.filter(function(x){return S.down[x];}),up=idx.filter(function(x){return !S.down[x];});
    var seen=S.health?up:idx,sh=seen.length?dist(S.algo,seen,S.heavy):{};
    var util={},hottest=0,over=0,deadShare=0;
    idx.forEach(function(x){
      if(S.down[x]){util[x]=0;if(!S.health)deadShare+=sh[x]||0;return;}
      util[x]=(sh[x]||0)*rps/CAP;hottest=Math.max(hottest,util[x]);
      over+=(sh[x]||0)*Math.max(0,1-1/Math.max(util[x],1e-9));
    });
    var err=up.length?Math.min(1,deadShare+over):1;
    var avg=up.length?rps/(up.length*CAP):Infinity;
    var bounce=S.sess==='stateful'&&S.algo!=='sticky'&&up.length>1?(up.length-1)/up.length:0;
    var lost=S.sess==='stateful'&&S.algo==='sticky'?downL.length/n:0;
    var one=up.length>1&&rps/((up.length-1)*CAP)<1;
    return {n:n,rps:rps,idx:idx,up:up,downL:downL,sh:sh,util:util,hottest:hottest,avg:avg,err:err,over:over,deadShare:deadShare,bounce:bounce,lost:lost,one:one,cap:up.length*CAP,
      cost:n*SERVER_COST+S.lb*25};
  }

  var HTML=
    '<div class="flow" id="top3"></div><div class="nodes" id="nodes3"></div>'+
    '<div class="readouts"><div><div class="k">Peak req/s</div><div class="v" id="rps3">0</div></div><div><div class="k">Capacity</div><div class="v" id="cap3">0</div></div><div><div class="k">Cost / month</div><div class="v" id="cost3">$0</div></div></div>'+
    H.usersSlider('u3',300000)+H.slider('n3','App servers',1,12,3)+
    H.seg('algo','How the balancer picks',[{v:'rr',l:'Round robin'},{v:'least',l:'Least loaded'},{v:'sticky',l:'Sticky by user'}],'rr')+
    H.slider('h3','Heavy requests (40× cost, like report exports)',0,30,10)+
    H.seg('sess','Where sessions live',[{v:'stateful',l:'In server memory'},{v:'stateless',l:'Shared store'}],'stateful')+
    H.seg('health','Health checks',[{v:'on',l:'On'},{v:'off',l:'Off'}],'on')+
    H.seg('lb','Load balancers',[{v:'1',l:'One'},{v:'2',l:'A pair'}],'1')+
    '<ul class="gauges" id="g3"></ul><p class="verdict" id="v3" aria-live="polite"></p>';

  function init(el){
    root=el;
    H.bind(el,{
      u3:function(v){S.users=H.logU(v);SL.refresh();},
      n3:function(v){S.n=Number(v);SL.refresh();},
      h3:function(v){S.heavy=Number(v);SL.refresh();}
    });
  }
  function update(){
    var c=calc(),i;
    q('#u3').value=H.vOf(S.users);H.setText(root,'u3V',H.fmtN(S.users));
    H.setText(root,'n3V',String(S.n));H.setText(root,'h3V',S.heavy+'%');
    H.setText(root,'rps3',H.fmtRps(c.rps));H.setText(root,'cap3',H.fmtN(c.cap)+' req/s');H.setText(root,'cost3',H.money(c.cost));
    ['algo','sess','health','lb'].forEach(function(k){H.syncSeg(root,k,k==='health'?(S.health?'on':'off'):k==='lb'?String(S.lb):S[k]);});
    var lbSt=S.lb===2?'ok':'warn';
    q('#top3').innerHTML='<div class="nd st-ok"><b>Users</b><span class="sub">'+H.fmtRps(c.rps)+' req/s</span></div><span class="arr">→</span>'+
      '<div class="nd st-'+lbSt+'"><b>Load balancer</b><span class="sub">'+(S.lb===2?'2 instances':'1 instance')+'</span></div><span class="arr">→</span><div class="nd st-info"><b>'+c.up.length+' of '+c.n+' servers up</b><span class="sub">250 req/s each</span></div>';
    var h='';
    c.idx.forEach(function(x){
      var dead=!!S.down[x],u=c.util[x],st=dead?'bad':u<0.7?'ok':u<1?'warn':'bad';
      h+='<div class="nd st-'+st+(dead?' dead':'')+'"><b>Server '+(x+1)+'</b><div class="meter"><i style="width:'+Math.round(H.clamp(u,0,1)*100)+'%"></i></div><span class="sub">'+(dead?'down':H.pct(u)+' busy')+'</span>'+
        '<button class="btn mini" style="margin-top:6px" data-act="lvl" data-k="kill" data-v="'+x+'" aria-pressed="'+dead+'">'+(dead?'Revive':'Kill')+'</button></div>';
    });
    q('#nodes3').innerHTML=h;
    var g='',avgSt=c.up.length===0?'bad':c.avg<0.6?'ok':c.avg<1?'warn':'bad';
    g+=H.gauge('Total capacity',c.up.length?H.pct(c.avg)+' of '+H.fmtN(c.cap)+' req/s':'no servers up',c.up.length?c.avg:1,avgSt,
      avgSt==='ok'?'':avgSt==='warn'?'Little headroom left. One more failure could overload the rest.':'Demand is above total capacity.');
    var hotSt=c.hottest<0.7?'ok':c.hottest<1?'warn':'bad';
    g+=H.gauge('Hottest server',H.pct(c.hottest)+' busy (average '+H.pct(Math.min(c.avg,9.99))+')',c.hottest,hotSt,
      c.hottest>c.avg*1.25&&c.up.length>1?'Load is uneven. Some servers work much harder than others.':'');
    var errSt=c.err<0.001?'ok':c.err<0.05?'warn':'bad';
    g+=H.gauge('Failed requests',H.pct(c.err),c.err*4,errSt,
      c.deadShare>0?'Health checks are off, so the balancer still sends '+H.pct(c.deadShare)+' of traffic to dead servers.':c.over>0.001?'Some servers are past their limit and drop requests.':c.up.length===0?'Nothing is running.':'');
    var sessSt=c.bounce>0.2||c.lost>0.2?'bad':c.bounce>0||c.lost>0?'warn':'ok';
    g+=H.gauge('Login sessions',c.bounce>0?H.pct(c.bounce)+' of requests lack the user\'s session':c.lost>0?H.pct(c.lost)+' of users logged out':'no session problems',null,sessSt,
      c.bounce>0?'Sessions live in one server\'s memory, but requests spread across all servers. Users get sent back to the login page.':c.lost>0?'Those servers took their users\' sessions with them.':'');
    var redSt=c.up.length===0?'bad':c.one?'ok':'warn';
    g+=H.gauge('Can lose one server',c.one?'yes':'no',null,redSt,c.one?'':c.up.length<=1?'There is no spare server.':'Without one server, the rest could not carry the load.');
    g+=H.gauge('Load balancer',S.lb===2?'pair, one takes over':'single instance',null,S.lb===2?'ok':'warn',S.lb===2?'':'If this one machine fails, every server behind it is unreachable.');
    q('#g3').innerHTML=g;
    var v;
    if(c.up.length===0)v='Every server is down. Nothing can answer.';
    else if(c.err>=0.05)v=H.pct(c.err)+' of requests fail right now.';
    else if(c.bounce>0.2)v='Capacity is fine, but users keep losing their sessions. This is the stateful servers problem.';
    else if(avgSt==='bad')v='Add servers: demand is above capacity.';
    else if(!c.one&&S.n>1)v='It works, but one failure would overload the rest.';
    else v='Healthy. Servers share the load and survive losing one.';
    H.setText(root,'v3',v);
    SL.setMode(c.up.length+' of '+c.n+' servers up');
  }
  function apply(o){
    if(o.users!==undefined)S.users=Math.max(1,Math.round(Number(o.users)));
    if(o.n!==undefined)S.n=H.clamp(Math.round(Number(o.n)),1,12);
    if(o.algo)S.algo=o.algo;
    if(o.heavy!==undefined)S.heavy=Number(o.heavy);
    if(o.sess)S.sess=o.sess;
    if(o.health!==undefined)S.health=!!o.health;
    if(o.lb!==undefined)S.lb=Number(o.lb);
    if(o.down){S.down={};o.down.forEach(function(x){S.down[x]=true;});}
  }
  function act(k,v){
    if(k==='algo')S.algo=v;else if(k==='sess')S.sess=v;else if(k==='health')S.health=v==='on';
    else if(k==='lb')S.lb=Number(v);else if(k==='kill'){var x=Number(v);if(S.down[x])delete S.down[x];else S.down[x]=true;}
  }
  function initState(){S.users=300000;S.n=3;S.algo='rr';S.heavy=10;S.sess='stateful';S.health=true;S.lb=1;S.down={};}

  SL.add({id:3,short:'Add a second server',title:'Add a second server',
    tag:'One box broke at 144k users. Put several behind a load balancer and find out what that fixes and what it breaks.',
    sim:{html:HTML,init:function(el){initState();init(el);},update:update,apply:apply,act:act},
    steps:[
      {t:'Why one box was not enough',dyn:true,
       b:function(){var rps=H.peakRps(S.users),need=Math.ceil(rps/(CAP*0.6));
         return '<p>Level 2 ended with a box that tops out near 250 req/s. The fix is to run several copies of the app and share the traffic. This is horizontal scaling.</p><div class="calc"><span>Peak load at '+H.fmtC(S.users)+' users</span><span>'+H.fmtRps(rps)+' req/s</span><span>One small server</span><span>250 req/s</span><span class="tot">Servers to stay at 60% busy</span><span class="tot">'+need+'</span></div><p>Why 60%? Headroom absorbs bursts and failures. Try 1,000,000 users and 12 servers.</p>';},
       tries:[{l:'1M users, 12 servers',users:1000000,n:12,down:[]},{l:'Back to 3 servers',users:300000,n:3,down:[]}]},
      {t:'What a load balancer does',dyn:true,
       b:function(){var c=calc();
         return '<p>The load balancer is the one public address. It accepts each request and forwards it to a healthy server.</p>'+
         H.table(['Strategy','Good at','Watch out for'],[
           {c:['Round robin','Simple, fair by request count','Ignores how heavy each request is']},
           {c:['Least loaded','Evens out heavy and light requests','Needs the balancer to track work in flight']},
           {c:['Sticky by user','Keeps a user on one server','Popular users overload one server']}])+
         '<p>Right now the hottest server is at '+H.pct(c.hottest)+' and the average is '+H.pct(Math.min(c.avg,9.99))+'. Raise heavy requests and compare strategies.</p>';},
       tries:[{l:'Round robin, 20% heavy, 6 servers',algo:'rr',heavy:20,n:6,users:600000,down:[]},{l:'Least loaded',algo:'least'},{l:'Sticky by user',algo:'sticky'}]},
      {t:'Servers must forget users',dyn:true,
       b:function(){var c=calc();
         return '<p>If a server keeps your login session in its own memory, the next request may land on a server that has never heard of you. You get sent back to the login page.</p><p>Two fixes: stick every user to one server, or make the servers stateless. Stateless means the session lives in a shared store such as a cache or a signed cookie, so any server can handle any request.</p><p>Sticky helps until a server dies. Stateless survives it. Currently: '+(c.bounce>0?H.pct(c.bounce)+' of requests lose their session.':c.lost>0?H.pct(c.lost)+' of users are logged out.':'no session problems.')+'</p>';},
       tries:[{l:'Sessions in memory, round robin',sess:'stateful',algo:'rr',down:[]},{l:'Sticky, then kill server 1',sess:'stateful',algo:'sticky',down:[0]},{l:'Shared session store',sess:'stateless',down:[]}]},
      {t:'Health checks',dyn:true,
       b:function(){var c=calc();
         return '<p>Servers die. A health check is a small request the balancer sends every few seconds, for example "are you alive?". After a few failures it stops sending traffic to that server.</p><p>Without it, a dead server keeps receiving its share and every request sent there fails. Currently '+H.pct(c.err)+' of requests fail.</p>';},
       tries:[{l:'Kill server 2, checks off',health:false,sess:'stateless',algo:'rr',down:[1]},{l:'Turn checks on',health:true},{l:'Revive everything',down:[]}]},
      {t:'You moved the single point of failure',
       b:function(){return '<p>You now have several app servers, but one load balancer in front of them. If it fails, nobody can reach any server.</p><p>The usual answer is a pair of balancers sharing one address, so a standby takes over, or a managed cloud balancer that runs across zones. The pattern repeats through the whole course: removing one weak point exposes the next one.</p>';},
       tries:[{l:'One balancer',lb:1},{l:'A pair',lb:2}]},
      {t:'What you can take away',

  SL.add({id:4,short:'Pull the database out',title:'Pull the database out',

    steps:[
      {t:'Why give the database its own machine',
       b:function(){return '<p>App servers are interchangeable. Any copy can answer any request, so you add more when traffic grows and throw one away when it fails.</p><p>A database is different. It holds the one true copy of your data. You cannot spin up a second copy and let both accept writes without extra machinery, because the copies would disagree.</p><p>So the database moves to its own server, sized for database work: lots of RAM, fast disk, and nothing else competing for them. The app servers around it become disposable.</p>';}},
      {t:'The new bottleneck',dyn:true,

       tries:[{l:'20 apps, 50 each, no pooler',apps:20,pool:50,pooler:false,db:'L'},{l:'Add a pooler',pooler:true}]},

(function(){

    if(o.ttl!==undefined)S.tv=H.clamp(Math.round(Math.log10(Number(o.ttl))*100),0,356);
    if(o.read!==undefined)S.read=Number(o.read);
    if(o.inv!==undefined)S.inv=!!o.inv;if(o.coal!==undefined)S.coal=!!o.coal;if(o.cache!==undefined)S.cacheUp=!!o.cache;
  }
  function act(k,v){
    if(k==='skew')S.skew=v;else if(k==='inv')S.inv=v==='on';else if(k==='coal')S.coal=v==='on';else if(k==='cache')S.cacheUp=v==='up';
  }
  function initState(){S.users=1000000;S.cv=170;S.skew='typical';S.tv=178;S.read=90;S.cacheUp=true;S.inv=true;S.coal=false;}

  SL.add({id:5,short:'Caching',title:'Caching',
    tag:'The same questions get asked over and over. Answer them from fast memory and the database sees a fraction of the load.',
    sim:{html:HTML,init:function(el){initState();init(el);},update:update,apply:apply,act:act},
    steps:[
      {t:'Why caching works',dyn:true,
       b:function(){var c=calc();
         return '<p>Traffic is not spread evenly. A small set of items gets most of the requests: popular products, the front page, a viral post. A cache keeps those hot items in memory next to the app.</p><p>With a cache holding '+H.pct(c.f)+' of all data, the hit ratio is '+H.pct(c.hit)+'. The database handles '+H.fmtN(c.dbQps)+' queries/s instead of '+H.fmtN(c.qps)+'.</p><p>Set the skew to Flat and watch the benefit shrink. A cache only helps when some items are asked for more than others.</p>';},
       tries:[{l:'Typical skew, 5% cache',skew:'typical',cpct:5},{l:'Flat skew',skew:'flat'},{l:'A few hot items',skew:'heavy'}]},
      {t:'Where to cache',
       b:function(){return '<p>Caches stack. A request should stop at the first layer that can answer it.</p>'+H.table(['Layer','Typical time','Good for'],[
         {c:['Browser and CDN','0 to 30 ms','Images, scripts, public pages']},
         {c:['App server memory','microseconds','Small, rarely changing data such as settings']},
         {c:['Shared cache (Redis, Memcached)','about 1 ms','Sessions, profiles, computed results shared by all servers']},
         {c:['Database buffer','automatic','The database already caches recently used pages']}])+'<p>This level uses the shared cache because every app server can use it.</p>';}},
      {t:'Size and skew',dyn:true,
       b:function(){var c=calc();
         return '<p>Hit ratio rises quickly at first, then flattens. Doubling a small cache helps a lot. Doubling a large cache helps a little.</p><p>Now: '+H.pct(c.f)+' of data cached gives '+H.pct(c.hit0)+' hits before TTL effects, costing about '+H.money(c.cost)+' a month in memory.</p>';},
       tries:[{l:'0.5% cache',cpct:0.5},{l:'5% cache',cpct:5},{l:'50% cache',cpct:50}]},
      {t:'TTL and invalidation',dyn:true,
       b:function(){var c=calc();
         return '<p>There are two hard problems in computing: naming things, and cache invalidation. A cached copy can go stale the moment the database changes.</p><p>Two tools control it. A TTL (time to live) expires entries after a set time. Invalidation removes an entry when the data changes.</p>'+
         H.table(['Pattern','Write path','Trade-off'],[
           {c:['Cache-aside','Write the database, delete the cache entry','Most common. A short window of staleness is possible']},
           {c:['Write-through','Write cache and database together','Always fresh, slower writes']},
           {c:['Write-behind','Write cache now, database later','Fast writes, data loss if the cache dies first']}])+
         '<p>A very short TTL of '+fmtTtl(c.T)+' lowers the hit ratio. A very long one keeps old data. Try both.</p>';},
       tries:[{l:'TTL 2 s',ttl:2},{l:'TTL 1 min',ttl:60},{l:'TTL 1 hour, no delete on write',ttl:3600,inv:false}]},
      {t:'When the cache itself fails',dyn:true,
       b:function(){var c=calc();
         return '<p>Two failures matter.</p><ul><li><b>Stampede.</b> A hot entry expires and hundreds of requests miss at once. All of them query the database for the same thing. Fixes: let one request rebuild while others wait (coalescing), add random jitter to TTLs, refresh popular entries before they expire.</li><li><b>Cold start.</b> If the cache restarts empty, the database suddenly sees all the traffic. At this load that is '+H.pct(c.noCacheU)+' of its capacity.</li></ul><p>If the database cannot survive without the cache, the cache is no longer an optimisation. It is a dependency.</p>';},
       tries:[{l:'Stampede, no coalescing',coal:false,cache:true},{l:'Turn coalescing on',coal:true},{l:'Kill the cache',cache:false},{l:'Bring it back',cache:true}]},
      {t:'What you can take away',
       b:function(){return '<ul><li>Caches work because traffic is skewed. Measure the skew before you build.</li><li>Cache the hot part, not everything. Memory is expensive.</li><li>Pick TTL and invalidation together. Staleness is a product decision.</li><li>Defend the database from stampedes and cold starts.</li></ul><p>Next level: even with a cache, writes and cache misses still hit one database. Copy it to more machines with replication.</p>';}}
    ],
    quiz:[
      {q:'Caching just 5% of the data can serve far more than 5% of requests. Why?',o:['Memory is faster than disk','Access is skewed: a small set of items gets most of the traffic','The cache compresses data','Requests are cached by the browser'],a:1,h:'Think about popular items versus the long tail.',x:'Real traffic is skewed. If every item were equally popular, a 5% cache would serve about 5% of requests.'},
      {q:'A popular cache entry expires and 500 requests miss at once. What is this called and what helps?',o:['A cold start: restart the cache','A stampede: let one request rebuild while others wait, and jitter TTLs','A split brain: add replicas','A memory leak: add RAM'],a:1,h:'Many requests, one expired key.',x:'A cache stampede. Coalescing, jittered expiry and early refresh keep the database safe.'},
      {q:'Your database only survives because the cache absorbs 90% of reads. What is the risk?',o:['None, caches never fail','If the cache restarts empty, the database receives all traffic and can fall over','The cache will fill up','Users see old data'],a:1,h:'What happens in the minute after a cache restart?',x:'A cold cache sends the full load to the database. Warm caches gradually and protect the database with limits.'},
      {q:'You raise the TTL from 1 minute to 1 hour. What is the trade-off?',o:['Higher hit ratio but staler data','Lower hit ratio and staler data','Higher hit ratio and fresher data','No change'],a:0,h:'Entries live longer.',x:'Longer TTLs keep entries around, which raises hits and also lets old data live longer.'}
    ]});
})();
/* ===== Level 6: replication and failover ===== */
(function(){
  var H=SL.H,NODE=8000,NODE_COST=780;

  var HTML=
    '<div class="flow" id="fl6"></div><div class="nodes" id="rep6"></div>'+
    '<div class="readouts"><div><div class="k">Reads/s</div><div class="v" id="rd6">0</div></div><div><div class="k">Writes/s</div><div class="v" id="wr6">0</div></div><div><div class="k">Cost / month</div><div class="v" id="cost6">$0</div></div></div>'+
    H.usersSlider('u6',1000000)+H.slider('r6','Read replicas',0,5,2)+H.slider('rd6','Reads (% of queries)',50,99,90)+
    H.seg('use','Send reads to',[{v:'primary',l:'Primary only'},{v:'replicas',l:'Replicas'}],'replicas')+
    H.seg('sync','Replication',[{v:'async',l:'Asynchronous'},{v:'sync',l:'Synchronous'}],'async')+
    H.seg('fo','Failover',[{v:'auto',l:'Automatic'},{v:'manual',l:'Manual'}],'auto')+
    '<div class="row"><button class="btn danger" id="kp6" data-act="lvl" data-k="kill" aria-pressed="false">Kill the primary</button></div>'+
    '<ul class="gauges" id="g6"></ul><p class="verdict" id="v6" aria-live="polite"></p>';

  function init(el){
    root=el;
    H.bind(el,{u6:function(v){S.users=H.logU(v);SL.refresh();},r6:function(v){S.r=Number(v);SL.refresh();},rd6:function(v){S.read=Number(v);SL.refresh();}});
  }
  function st(u){return u<0.7?'ok':u<1?'warn':'bad';}
  function update(){
    var c=calc(),r=S.r;
    q('#u6').value=H.vOf(S.users);H.setText(root,'u6V',H.fmtN(S.users));H.setText(root,'r6V',String(r));H.setText(root,'rd6V',S.read+'%');
    H.syncSeg(root,'use',S.use?'replicas':'primary');H.syncSeg(root,'sync',S.sync);H.syncSeg(root,'fo',S.fo);
    H.setText(root,'rd6',H.fmtN(c.reads));H.setText(root,'wr6',H.fmtN(c.writes));H.setText(root,'cost6',H.money(c.cost));
    var pst=S.down?'bad':st(c.pU);
    q('#fl6').innerHTML='<div class="nd st-ok"><b>App servers</b><span class="sub">'+H.fmtN(c.Q)+' queries/s</span></div><span class="arr">→</span>'+
      '<div class="nd st-'+pst+(S.down?' dead':'')+'"><b>Primary</b><div class="meter"><i style="width:'+Math.round(H.clamp(c.pU,0,1)*100)+'%"></i></div><span class="sub">'+(S.down?'down':H.pct(c.pU)+' busy')+'</span></div>';
    var h='',i;
    for(i=0;i<r;i++){
      var promo=S.down&&i===0;
      h+='<div class="nd st-'+(promo?'warn':st(c.rU))+'"><b>Replica '+(i+1)+'</b><div class="meter"><i style="width:'+Math.round(H.clamp(c.rU,0,1)*100)+'%"></i></div><span class="sub">'+(promo?(S.fo==='auto'?'being promoted':'waiting for a human'):H.pct(c.rU)+' busy · lag '+H.fmtMs(c.lag))+'</span></div>';
    }
    q('#rep6').innerHTML=h||'<p class="small">No replicas. The primary does everything.</p>';
    var g='';
    g+=H.gauge('Primary load',H.fmtN(c.writes+(c.use?0:c.reads))+' of '+H.fmtN(NODE)+' queries/s',Math.min(1,c.pU),st(c.pU),st(c.pU)==='ok'?'':c.use?'Writes alone are too much for one machine. Replicas cannot help with that.':'The primary is also answering all reads. Send reads to replicas.');
    g+=H.gauge('Replica load',r===0?'no replicas':H.fmtN(c.use?c.reads/r+c.writes*0.5:c.writes*0.5)+' of '+H.fmtN(NODE)+' queries/s each',r===0?null:Math.min(1,c.rU),r===0?'info':st(c.rU),r===0?'':'Each replica applies every write too, so adding replicas has diminishing returns.');
    var stSt=c.stale>0.5?'bad':c.stale>0.15?'warn':'ok';
    g+=H.gauge('Replication lag',r===0?'n/a':S.sync==='sync'?'none (waits for a replica)':H.fmtMs(c.lag),null,r===0?'info':stSt,
      c.stale>0?'A user who writes and reads straight back has about a '+H.pct(c.stale)+' chance of reading old data from a replica.':'');
    g+=H.gauge('Write latency',H.fmtMs(c.wMs),Math.min(1,c.wMs/50),c.wMs<20?'ok':c.wMs<80?'warn':'bad',S.sync==='sync'&&r>0?'Each write waits for a replica to confirm, which adds time.':'');
    var fst=r===0?'bad':S.fo==='manual'?'bad':c.lostAck>=1?'warn':'ok';
    var ftxt=r===0?'With no replica the app is down about '+H.fmtDur(c.restore)+' while a backup restores (if you have one).'
      :'Writes fail for about '+H.fmtDur(c.downtime)+' ('+H.fmtN(c.failedW)+' attempts).'+(S.sync==='async'?' Roughly '+H.fmtN(c.lostAck)+' acknowledged writes may be lost.':' No acknowledged writes are lost.')+(c.use?' Reads keep working.':' Reads stop too, because they all used the primary.');
    g+=H.gauge('If the primary dies',r===0?'long outage':H.fmtDur(c.downtime)+' without writes',null,fst,ftxt);
    q('#g6').innerHTML=g;
    var v;

    else if(c.use===false&&r>0)v='You have replicas but reads still go to the primary. Switch reads to replicas.';

    H.setText(root,'v6',v);

  function apply(o){

    if(o.r!==undefined)S.r=H.clamp(Number(o.r),0,5);
    if(o.read!==undefined)S.read=Number(o.read);
    if(o.use!==undefined)S.use=!!o.use;

  function act(k,v){

  }
  function initState(){S.users=1000000;S.r=2;S.read=90;S.use=true;S.sync='async';S.fo='auto';S.down=false;}

  SL.add({id:6,short:'Replication',title:'Replication',
    tag:'Copy the database to more machines. See what it fixes, what it cannot fix, and what happens when the primary dies.',
    sim:{html:HTML,init:function(el){initState();init(el);},update:update,apply:apply,act:act},
    steps:[
      {t:'Most apps mostly read',dyn:true,
       b:function(){var c=calc();
         return '<p>Look at a typical product: people browse far more than they post. A 90 to 99% read share is common.</p><p>At '+H.fmtC(S.users)+' users the database sees '+H.fmtN(c.reads)+' reads and '+H.fmtN(c.writes)+' writes per second. Reads can be answered by any copy of the data. Writes cannot, because only one machine is allowed to decide the order.</p><p>That split is the idea behind a primary with read replicas.</p>';},
       tries:[{l:'90% reads',read:90},{l:'99% reads',read:99},{l:'50% reads',read:50}]},
      {t:'Replicas scale reads, not writes',dyn:true,
       b:function(){var c=calc();
         return '<p>Try 0 replicas, then 3. Read load moves off the primary. Now drop reads to 50% with 3 replicas: the primary is busy with writes and every replica also replays them.</p><p>Primary at '+H.pct(c.pU)+', replicas at '+H.pct(c.rU)+'. When writes dominate, the next tool is sharding, two levels from now.</p>';},
       tries:[{l:'No replicas',r:0,read:90,use:true},{l:'3 replicas',r:3,read:90},{l:'50% reads, 3 replicas',r:3,read:50}]},
      {t:'Lag and read-your-writes',dyn:true,
       b:function(){var c=calc();
         return '<p>Asynchronous replicas copy changes a little later. During that lag, a replica returns old data. The painful case is a user who posts a comment, the page reloads from a replica, and the comment is missing.</p><p>Current lag: '+H.fmtMs(c.lag)+'. Replicas under heavy load fall further behind.</p><p>Common fixes: read your own recent writes from the primary, or pin a user to the primary for a few seconds after they write.</p>';},
       tries:[{l:'Light load',users:300000,r:2},{l:'Heavy load',users:3000000,r:2}]},
      {t:'Synchronous or asynchronous',dyn:true,
       b:function(){var c=calc();
         return '<p>With synchronous replication the primary waits for a replica to confirm each write before answering. Nothing acknowledged is lost, and each write takes longer ('+H.fmtMs(c.wMs)+' now). If the replica is slow or down, writes stall.</p><p>With asynchronous replication the primary answers at once and ships changes later. Writes are fast. If the primary dies, the last moments of acknowledged writes can be lost.</p>';},
       tries:[{l:'Asynchronous',sync:'async'},{l:'Synchronous',sync:'sync'}]},
      {t:'Failover',dyn:true,
       b:function(){var c=calc();
         return '<p>When the primary dies, promote a replica. Automatic failover needs a monitor that notices the failure, picks the most up-to-date replica, and redirects writes. Typical downtime is tens of seconds. By hand it can take many minutes.</p><p>The monitor must be careful: if two nodes both think they are the primary, they accept different writes. That is split brain, and it is why failover uses a majority vote.</p><p>Right now: '+(S.r===0?'no replica, '+H.fmtDur(c.restore)+' to restore.':H.fmtDur(c.downtime)+' without writes.')+'</p>';},
       tries:[{l:'Kill primary, automatic',down:true,fo:'auto',r:2},{l:'Same, manual',fo:'manual'},{l:'No replicas',r:0,down:true},{l:'Reset',down:false,r:2,fo:'auto'}]},
      {t:'What you can take away',
       b:function(){return '<ul><li>Replicas scale reads and add a standby. They do not scale writes.</li><li>Lag means reads can be stale. Design for read-your-writes.</li><li>Synchronous is safe and slower. Asynchronous is fast and can lose recent writes.</li><li>Automatic failover turns an outage into a blip. Test it.</li></ul><p>Next level: when one primary cannot take the writes or hold the data, split the data itself across machines.</p>';}}
    ],
    quiz:[
      {q:'95% of your database traffic is reads. What helps most?',o:['A faster primary only','Read replicas','More app servers','A bigger network'],a:1,h:'Which kind of work can any copy of the data do?',x:'Reads can be answered by any copy. Replicas share that load and also give you a standby.'},
      {q:'What do read replicas NOT help with?',o:['Read throughput','High availability','Write throughput','Reporting queries'],a:2,h:'Every replica still has to apply each write.',x:'All writes go through one primary, and each replica replays them too.'},
      {q:'A user posts a comment, refreshes, and it is gone. A minute later it appears. What happened?',o:['The comment was deleted','Replica lag: the read hit a replica that had not caught up','A cache bug only','The primary failed'],a:1,h:'Where did the refresh read from?',x:'This is the read-your-writes problem. Read recent writes from the primary or pin the user briefly.'},
      {q:'With asynchronous replication, the primary crashes. What is the risk?',o:['Reads become slow','Recently acknowledged writes may not have reached any replica and are lost','Nothing, replicas always match','The replicas delete data'],a:1,h:'The primary answers before replicas confirm.',x:'Async trades durability of the last moments for speed. Synchronous replication avoids the loss.'}
    ]});
})();
/* ===== Level 7: sharding ===== */
(function(){
  var H=SL.H,NK=100000,K=6000,SHARD_Q=8000,SHARD_TB=4,VN=50;
  var S={n:6,strat:'hash',skew:1,hot:0,qv:430,dv:130,fan:0,moved:null};
  var root=null,ringCache={},loadCache={};
  function q(s){return root.querySelector(s);}
  function qps(){return Math.pow(10,S.qv/100);}
  function tb(){return Math.max(1,Math.round(Math.pow(10,S.dv/100)));}

  function ring(n){
    if(ringCache[n])return ringCache[n];
    var pts=[],s,v;
    for(s=0;s<n;s++)for(v=0;v<VN;v++)pts.push({h:H.hash(s*1000+v+12345),s:s});
    pts.sort(function(a,b){return a.h-b.h;});
    return ringCache[n]=pts;
  }
  function assign(key,n,strat){
    if(strat==='range')return Math.min(n-1,Math.floor(key/(NK/n)));
    if(strat==='hash')return H.hash(key)%n;
    var rg=ring(n),h=H.hash(key*7+1),lo=0,hi=rg.length;
    while(lo<hi){var mid=(lo+hi)>>1;if(rg[mid].h<h)lo=mid+1;else hi=mid;}
    return rg[lo===rg.length?0:lo].s;
  }
  function loads(n,strat,p,hot){
    var ck=[n,strat,p,hot].join('|');if(loadCache[ck])return loadCache[ck];
    var r=H.prng(5),c=[],i;for(i=0;i<n;i++)c.push(0);
    for(i=0;i<K;i++){var key=r()<hot/100?777:Math.floor(NK*Math.pow(r(),p));c[assign(key,n,strat)]++;}
    return loadCache[ck]=c.map(function(x){return x/K;});
  }
  function movedFrac(n,strat){
    var moved=0,N=3000,i;
    for(i=0;i<N;i++){var key=Math.floor(i*(NK/N));if(assign(key,n,strat)!==assign(key,n+1,strat))moved++;}
    return moved/N;
  }
  function calc(){
    var Q=qps(),D=tb(),n=S.n,sh=loads(n,S.strat,S.skew,S.hot),fan=S.fan/100,routed=Q*(1-fan),fanned=Q*fan;
    var util=sh.map(function(s){return (routed*s+fanned)/SHARD_Q;});
    var hottest=Math.max.apply(null,util),avg=(routed+fanned*n)/(n*SHARD_Q);
    var slowP=1-Math.pow(0.99,n),slowAll=fan*slowP+(1-fan)*0.01;
    return {Q:Q,D:D,n:n,sh:sh,util:util,hottest:hottest,avg:avg,needS:Math.ceil(D/SHARD_TB),needT:Math.ceil(Q/(SHARD_Q*0.6)),perTB:D/n,slowP:slowP,slowAll:slowAll,imb:Math.max.apply(null,sh)*n};
  }
  var HTML=
    '<div class="nodes" id="nd7"></div>'+
    '<div class="readouts"><div><div class="k">Queries/s</div><div class="v" id="q7v">0</div></div><div><div class="k">Data</div><div class="v" id="d7v">0</div></div><div><div class="k">Shards</div><div class="v" id="n7v">0</div></div></div>'+
    H.slider('n7','Shards',1,64,6)+
    H.seg('strat','How keys pick a shard',[{v:'range',l:'Range of IDs'},{v:'hash',l:'Hash mod N'},{v:'ring',l:'Consistent hash'}],'hash')+
    H.slider('sk7','Popularity skew (higher: low IDs are hotter)',1,6,1,0.5)+
    H.slider('hot7','One celebrity key (% of traffic)',0,40,0)+
    H.slider('q7','Peak queries per second',300,600,500)+
    H.slider('d7','Total data',0,200,130)+
    H.slider('f7','Queries that need every shard (%)',0,100,0)+
    '<div class="row"><button class="btn primary" data-act="lvl" data-k="add">Add a shard</button></div><p class="small" id="mv7"></p>'+
    '<ul class="gauges" id="g7"></ul><p class="verdict" id="v7" aria-live="polite"></p>';

  function init(el){
    root=el;
    H.bind(el,{n7:function(v){S.n=Number(v);S.moved=null;SL.refresh();},sk7:function(v){S.skew=Number(v);SL.refresh();},hot7:function(v){S.hot=Number(v);SL.refresh();},
      q7:function(v){S.qv=Number(v);SL.refresh();},d7:function(v){S.dv=Number(v);SL.refresh();},f7:function(v){S.fan=Number(v);SL.refresh();}});
  }
  function st(u){return u<0.7?'ok':u<1?'warn':'bad';}
  function update(){
    var c=calc();
    q('#n7').value=S.n;H.setText(root,'n7V',String(S.n));H.syncSeg(root,'strat',S.strat);
    q('#sk7').value=S.skew;H.setText(root,'sk7V',S.skew===1?'uniform':S.skew+'×');

      return '<div class="nd st-'+st(u)+'"><b>Shard '+(i+1)+'</b><div class="meter"><i style="width:'+Math.round(H.clamp(u,0,1)*100)+'%"></i></div><span class="sub">'+H.pct(u)+' busy</span><span class="sub">'+H.pct(c.sh[i])+' of keys hit</span></div>';
    }).join('');
    var g='';

    g+=H.gauge('Hottest shard',H.pct(c.hottest)+' busy (average '+H.pct(c.avg)+')',Math.min(1,c.hottest),st(c.hottest),c.hottest>1?'This shard is overloaded while others are idle. Adding shards does not fix an uneven key spread.':'');

      c.imb>=1.3?(S.hot>0?'One celebrity key sends '+S.hot+'% of traffic to a single shard, whatever the strategy.':S.strat==='range'?'With range sharding, popular IDs sit together on one shard.':'The key spread is uneven.'):'');
    var need=Math.max(c.needS,c.needT);

    var mv=S.moved===null?movedFrac(S.n,S.strat):S.moved;

    g+=H.gauge('Slow queries',H.pct(c.slowAll)+' of all queries',Math.min(1,c.slowAll*5),c.slowAll<0.02?'ok':c.slowAll<0.1?'warn':'bad',S.fan>0?'A query that needs all '+S.n+' shards is as slow as the slowest one. If each shard is slow 1% of the time, '+H.pct(c.slowP)+' of those queries are slow.':'');
    q('#g7').innerHTML=g;

  function apply(o){

  function initState(){S.n=6;S.strat='hash';S.skew=1;S.hot=0;S.qv=430;S.dv=130;S.fan=0;S.moved=null;}

  SL.add({id:7,short:'Sharding',title:'Sharding',
    tag:'When one primary cannot hold the data or take the writes, split the data across machines. The hard part is choosing how.',
    sim:{html:HTML,init:function(el){initState();init(el);},update:update,apply:apply,act:act},
    steps:[
      {t:'Shard last',dyn:true,
       b:function(){var c=calc();
         return '<p>Sharding splits one big dataset into pieces, each on its own database. It is the most powerful scaling tool and the most expensive in complexity. You lose easy joins, cross-piece transactions and simple queries.</p><p>Use it only when caches, replicas and a bigger machine are not enough. Two numbers tell you: data size and write traffic.</p><div class="calc"><span>'+c.D+' TB ÷ '+SHARD_TB+' TB per machine</span><span>'+c.needS+' shards</span><span>'+H.fmtC(c.Q)+' queries/s ÷ '+H.fmtN(SHARD_Q*0.6)+' (60% of one shard)</span><span>'+c.needT+' shards</span></div>';},
       tries:[{l:'Small: 20k/s, 8 TB, 4 shards',qps:20000,tb:8,n:4},{l:'Big: 200k/s, 40 TB, 64 shards',qps:200000,tb:40,n:64}]},
      {t:'Choosing the shard key',dyn:true,
       b:function(){var c=calc();
         return '<p>A shard key decides which shard owns a row, for example the user id. Two common ways to use it:</p><ul><li><b>Range.</b> IDs 1 to 25k on shard 1, 25k to 50k on shard 2. Good for range scans. Risky when popularity follows the ID, because popular rows cluster.</li><li><b>Hash.</b> Hash the key and take it modulo the shard count. Spreads rows evenly and loses range scans.</li></ul><p>Set the skew to 3× and compare the two. Busiest shard now: '+c.imb.toFixed(1)+'× the fair share.</p>';},
       tries:[{l:'Range, skewed',strat:'range',skew:3,n:8,hot:0,fan:0},{l:'Hash, same traffic',strat:'hash'}]},
      {t:'Resharding is the painful part',dyn:true,
       b:function(){
         var rows=['hash','ring','range'].map(function(s){return {num:[1],c:[{hash:'Hash mod N',ring:'Consistent hash',range:'Range of IDs'}[s],H.pct(movedFrac(S.n,s))]};});
         return '<p>Data grows, so you will add shards. With hash mod N, changing N changes almost every key\'s home. Nearly all the data has to move.</p><p>Consistent hashing places shards on a ring and gives each key to the next shard clockwise. A new shard only takes keys from its neighbours, about 1 in N+1.</p>'+
         H.table(['Strategy','Keys moved by adding 1 shard (now '+S.n+' to '+(S.n+1)+')'],rows)+'<p>Press Add a shard under each strategy to see the same number in the simulator.</p>';},
       tries:[{l:'Hash, 8 shards, add one',strat:'hash',n:8,add:true,skew:1,hot:0,fan:0},{l:'Consistent hash, 8 shards, add one',strat:'ring',n:8,add:true}]},
      {t:'Hot keys',dyn:true,
       b:function(){var c=calc();
         return '<p>Hashing spreads many keys evenly. It cannot split one key. A celebrity account, a viral post or one big customer sends traffic to a single row, and so to a single shard.</p><p>Fixes: cache the hot item, split the key (store several copies, such as <i>post:7#1</i> to <i>post:7#8</i>, and read a random one), or give the biggest customers their own shard.</p><p>Now the hottest shard is at '+H.pct(c.hottest)+'.</p>';},
       tries:[{l:'25% of traffic on one key',hot:25,strat:'hash',n:16,skew:1,fan:0,qps:60000},{l:'No hot key',hot:0,qps:20000}]},
      {t:'Queries across shards',dyn:true,
       b:function(){var c=calc();
         return '<p>If a query includes the shard key, one shard answers. If it does not, for example "find users by email" when you shard by user id, the query goes to every shard and waits for the slowest. Each shard also has to do the work.</p><p>With '+S.n+' shards and 1% slow answers per shard, '+H.pct(c.slowP)+' of such queries are slow. More shards make that worse.</p><p>Fixes: keep a secondary index (lookup table) that maps email to user id, and design so the common queries carry the shard key.</p>';},
       tries:[{l:'20% need all shards, 16 shards',fan:20,n:16,hot:0,strat:'hash',qps:20000},{l:'Index it away',fan:0}]},
      {t:'What you can take away',
       b:function(){return '<ul><li>Shard when data or writes outgrow one machine, and not before.</li><li>The shard key is the most important decision. Choose one that every common query carries.</li><li>Hash for even spread, range for scans, consistent hashing for painless growth.</li><li>No scheme fixes a single hot key. Cache or split it.</li><li>Queries without the key hit every shard and get slower as you grow.</li></ul><p>Next level: not all work has to happen while the user waits. Queues move slow tasks out of the request path.</p>';}}
    ],
    quiz:[
      {q:'You use hash(key) mod 8 and add a 9th shard. About how many keys move?',o:['About 1 in 9','About half','About 8 in 9','None'],a:2,h:'Most keys get a new remainder when the divisor changes.',x:'Changing N reshuffles almost everything. Consistent hashing limits the move to roughly 1 in N+1.'},
      {q:'You shard users by ID range, and the oldest IDs are the most active. What happens?',o:['Load spreads evenly','The first shard becomes a hot spot','Writes become faster','Nothing, ranges balance themselves'],a:1,h:'Where do the busy users live?',x:'When popularity follows the key, range sharding concentrates traffic on a few shards.'},
      {q:'One celebrity row gets 25% of all traffic. Hashing the key spreads it across shards. True or false?',o:['True, hashing balances any traffic','False, one key always maps to one shard, so cache or split it','True, but only with consistent hashing','False, because hashes collide'],a:1,h:'A hash of the same key is always the same.',x:'Hashing spreads different keys. A single hot key stays on one shard unless you cache or split it.'},
      {q:'A query that does not include the shard key runs on 16 shards, each slow 1% of the time. About what share of those queries are slow?',o:['1%','About 15%','About 50%','About 99%'],a:1,h:'The query is slow if any shard is slow.',x:'1 - 0.99^16 is about 15%. Scatter-gather queries inherit the worst shard.'}
    ]});

/* ===== Level 8: queues and async work ===== */
(function(){
  var H=SL.H,DT=0.2,HIST=300,MAXQ=5000;
  var S={arr:250,workers:3,per:100,bound:false,crash:0,idem:false};
  var T={depth:0,done:0,dropped:0,dup:0,supp:0,burst:0,paused:false,hist:[]};
  var root=null,timer=null;
  function q(s){return root.querySelector(s);}
  function cap(){return S.workers*S.per;}
  function effArr(){return S.arr*(T.burst>0?5:1);}

  function tick(){
    if(T.paused)return;
    var a=effArr()*DT,c=cap()*DT;
    T.depth+=a;
    var proc=Math.min(T.depth,c);T.depth-=proc;
    var redo=proc*S.crash/100;
    if(redo>0){T.depth+=redo;if(S.idem)T.supp+=redo;else T.dup+=redo;}
    T.done+=proc-redo;
    if(S.bound&&T.depth>MAXQ){T.dropped+=T.depth-MAXQ;T.depth=MAXQ;}
    if(T.burst>0)T.burst=Math.max(0,T.burst-DT);
    T.hist.push(T.depth);if(T.hist.length>HIST)T.hist.shift();
  }
  function resetSim(){T.depth=0;T.done=0;T.dropped=0;T.dup=0;T.supp=0;T.burst=0;T.paused=false;T.hist=[];for(var i=0;i<HIST;i++)tick();}

  var HTML=
    '<div class="readouts"><div><div class="k">Arriving /s</div><div class="v" id="ar8">0</div></div><div><div class="k">Workers can do /s</div><div class="v" id="cp8">0</div></div><div><div class="k">In the queue</div><div class="v" id="qd8">0</div></div></div>'+
    '<label class="ctl">Queue depth, last 60 seconds</label><div id="ch8"></div>'+
    H.slider('a8','Jobs arriving per second',10,1500,250,10)+H.slider('w8','Workers',1,20,3)+H.slider('p8','Jobs per worker per second',20,200,100,10)+
    H.seg('bound','Queue limit',[{v:'off',l:'No limit'},{v:'on',l:'5,000 jobs'}],'off')+
    H.slider('c8','Workers that crash after finishing (%)',0,30,0)+
    H.seg('idem','Idempotent jobs',[{v:'off',l:'Off'},{v:'on',l:'On'}],'off')+
    '<div class="row"><button class="btn primary" data-act="lvl" data-k="burst">Burst: 5× for 10 s</button><button class="btn" id="pz8" data-act="lvl" data-k="pause">Pause</button><button class="btn" data-act="lvl" data-k="reset">Reset</button></div>'+
    '<ul class="gauges" id="g8"></ul><p class="verdict" id="v8" aria-live="polite"></p>';

  function init(el){
    root=el;
    H.bind(el,{a8:function(v){S.arr=Number(v);SL.refresh();},w8:function(v){S.workers=Number(v);SL.refresh();},p8:function(v){S.per=Number(v);SL.refresh();},c8:function(v){S.crash=Number(v);SL.refresh();}});
    resetSim();
    timer=setInterval(function(){tick();update();},200);
  }
  function destroy(){if(timer){clearInterval(timer);timer=null;}}
  function update(){
    if(!root||!root.isConnected)return;
    var c=cap(),a=effArr(),util=a/c,wait=T.depth/c;
    q('#a8').value=S.arr;q('#w8').value=S.workers;q('#p8').value=S.per;q('#c8').value=S.crash;
    H.setText(root,'a8V',S.arr+'/s');H.setText(root,'w8V',String(S.workers));H.setText(root,'p8V',S.per+'/s');H.setText(root,'c8V',S.crash+'%');
    H.syncSeg(root,'bound',S.bound?'on':'off');H.syncSeg(root,'idem',S.idem?'on':'off');
    H.setText(root,'ar8',H.fmtN(a));H.setText(root,'cp8',H.fmtN(c));H.setText(root,'qd8',H.fmtN(T.depth));
    q('#pz8').textContent=T.paused?'Resume':'Pause';
    var mx=Math.max(100,Math.max.apply(null,T.hist)*1.1),mag=Math.pow(10,Math.floor(Math.log10(mx))),ymax=Math.ceil(mx/mag)*mag;
    var pts=T.hist.map(function(d,i){return [i*DT-(T.hist.length-1)*DT,d];});
    q('#ch8').innerHTML=H.chart({w:320,h:160,xmin:-60,xmax:0,ymax:ymax,series:[{pts:pts}],
      xticks:[{x:-60,l:'-60 s'},{x:-30,l:'-30 s'},{x:0,l:'now'}],yticks:[{y:0,l:'0'},{y:ymax/2,l:H.fmtC(ymax/2)},{y:ymax,l:H.fmtC(ymax)}],
      hlines:S.bound?[{y:MAXQ,l:'queue limit'}]:[],aria:'Queue depth over the last 60 seconds'});
    var g='',uSt=util<0.85?'ok':util<1?'warn':'bad';
    g+=H.gauge('Arrival vs. capacity',H.pct(util)+' of what workers can do',Math.min(1,util),uSt,uSt==='bad'?'Work arrives faster than workers finish it. The queue keeps growing.':'');
    var wSt=wait<2?'ok':wait<30?'warn':'bad';
    g+=H.gauge('Time until a new job starts',H.fmtDur(wait)+' waiting in line',Math.min(1,wait/60),wSt,wSt==='ok'?'':'Jobs wait this long before a worker picks them up.');
    g+=H.gauge('User waits for the request','sync '+H.fmtMs(Math.min(30000,400/(1-Math.min(util,0.995))))+' · async 20 ms',null,'info','Synchronous: the user waits while the work runs. Asynchronous: the user gets "accepted" at once and the work finishes later.');
    g+=H.gauge('Jobs dropped',H.fmtN(T.dropped),null,T.dropped>0?'bad':'ok',T.dropped>0?'The queue hit its limit. New jobs are rejected, which is how the system pushes back on callers.':S.bound?'':'Without a limit the queue never drops jobs. It grows until memory runs out.');

    q('#g8').innerHTML=g;
    var v=T.paused?'Paused.':uSt==='bad'?'Overloaded: '+H.fmtN(T.depth)+' jobs waiting and rising.':T.burst>0?'Burst in progress. The queue is absorbing it.':T.depth>50?'Draining the backlog.':'Healthy. The queue is nearly empty.';
    H.setText(root,'v8',v);

  }
  function apply(o){
    if(o.arr!==undefined)S.arr=Number(o.arr);if(o.workers!==undefined)S.workers=Number(o.workers);if(o.per!==undefined)S.per=Number(o.per);
    if(o.bound!==undefined)S.bound=!!o.bound;if(o.crash!==undefined)S.crash=Number(o.crash);if(o.idem!==undefined)S.idem=!!o.idem;
